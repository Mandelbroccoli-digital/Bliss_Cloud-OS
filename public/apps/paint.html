<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../subkernel-bus.js"></script>
<script src="../subkernel-bridge.js"></script>
<meta charset="UTF-8">
    <title>Canvas Paint</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; background: #ece9d8; font-family: Tahoma, sans-serif; font-size: 11px; overflow: hidden; }
        .toolbar { padding: 6px; background: #ece9d8; border-bottom: 1px solid #808080; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .toolbar label { display: flex; align-items: center; gap: 4px; }
        button { padding: 3px 8px; border: 1px solid #7a7a7a; background: #fff; border-radius: 2px; cursor: pointer; }
        button:hover { border-color: #000; background: #f0f0f0; }
        canvas { flex: 1; background: #fff; cursor: crosshair; display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="toolbar">
        <label>Color: <input type="color" id="color" value="#003399"></label>
        <label>Size: <input type="range" id="size" min="1" max="25" value="3" style="width: 70px;"></label>
        <button onclick="setEraser()">Eraser</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="saveToHost()" style="margin-left: auto; font-weight: bold;">💾 Save to Host FS</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let isEraser = false;

        function resize() {
            const rect = canvas.getBoundingClientRect();
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.putImageData(imgData, 0, 0);
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 50);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mouseleave', () => { drawing = false; ctx.beginPath(); });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const pos = getPos(e);
            ctx.lineWidth = document.getElementById('size').value;
            ctx.lineCap = 'round';
            ctx.strokeStyle = isEraser ? '#ffffff' : document.getElementById('color').value;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        function setEraser() { isEraser = !isEraser; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        async function saveToHost() {
            const dataUrl = canvas.toDataURL('image/png');
            const b64 = dataUrl.split(',')[1] || '';
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            const path = 'C:/Users/enemy/Documents/Bliss_Paint_' + stamp + '.png';
            try {
                if (window.subkernel && window.subkernel.invoke) {
                    await window.subkernel.invoke('write_text_file', { path: path, contents: b64 });
                    alert('Saved to host FS:
' + path);
                } else {
                    alert('No kernel bridge — image generated (' + b64.length + ' bytes base64).');
                }
            } catch (e) {
                const a = document.createElement('a'); a.href = dataUrl; a.download = 'bliss_paint_' + stamp + '.png'; a.click();
                console.warn('write_text_file failed, downloaded instead:', e);
            }
        }
            }
        }
    </script>
</body>
</html>
