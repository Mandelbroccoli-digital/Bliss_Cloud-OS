<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var XHTML = 'http://www.w3.org/1999/xhtml';
  var GRID = 20;

  var svgEl = document.getElementById('canvasEl');
  var worldG = document.getElementById('worldG');
  var ctxMenuEl = document.getElementById('ctxMenuEl');
  var statusTextEl = document.getElementById('statusTextEl');
  var countLabelEl = document.getElementById('countLabelEl');
  var zoomLabelEl = document.getElementById('zoomLabelEl');
  var busLabelEl = document.getElementById('busLabelEl');
  var modalEl = document.getElementById('modalEl');
  var modalTextEl = document.getElementById('modalTextEl');

  // ---- layers (created inside worldG so everything pans/zooms together) ----
  var gridMinor = mk('path', { 'class': 'grid-minor' });
  var gridMajor = mk('path', { 'class': 'grid-major' });
  var edgesG = mk('g', {});
  var nodesG = mk('g', {});
  var tempG = mk('g', {});
  var editorFO = document.createElementNS(NS, 'foreignObject');
  editorFO.setAttribute('id', 'editorFO');
  var editorBox = document.createElementNS(XHTML, 'div');
  editorBox.setAttribute('class', 'node-editor');
  editorBox.setAttribute('contenteditable', 'true');
  editorFO.appendChild(editorBox);
  worldG.appendChild(gridMinor);
  worldG.appendChild(gridMajor);
  worldG.appendChild(edgesG);
  worldG.appendChild(nodesG);
  worldG.appendChild(editorFO);
  worldG.appendChild(tempG);

  var tempPath = mk('path', { 'class': 'temp-line' });
  tempG.appendChild(tempPath);

  var measureCtx = document.createElement('canvas').getContext('2d');

  // ==================== state ====================
  var nodes = [];
  var edges = [];
  var nextId = 1;
  var nextEdgeId = 1;
  var view = { x: 40, y: 40, scale: 1 };
  var selection = null;            // { type:'node'|'edge', id }
  var editNodeId = null;           // non-null => inline editing active
  var editMode = null;             // 'title' | 'text'
  var pendingConn = null;          // { fromId, fromSide }
  var pan = null;                  // { sx, sy, ox, oy }
  var drag = null;                 // { id, sx, sy, nx, ny }
  var spaceHeld = false;
  var history = [];
  var historyIndex = -1;

  // ==================== helpers ====================
  function mk(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function nodeById(id) {
    for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
    return null;
  }
  function edgeById(id) {
    for (var i = 0; i < edges.length; i++) if (edges[i].id === id) return edges[i];
    return null;
  }
  function isNodeSel(n) { return selection && selection.type === 'node' && selection.id === n.id; }
  function isEdgeSel(e) { return selection && selection.type === 'edge' && selection.id === e.id; }
  function snap(v) { return Math.round(v / GRID) * GRID; }
  function showStatus(msg) { statusTextEl.textContent = msg; }

  // ==================== SubkernelBus IPC ====================
  function bus() {
    try { if (window.parent.subkernel) return window.parent.subkernel; } catch (err) {}
    try { if (window.subkernel) return window.subkernel; } catch (err) {}
    return null;
  }
  function busEmit(eventName, payload) {
    var b = bus();
    if (b && typeof b.emit === 'function') {
      try { b.emit('Diagrammer', eventName, payload); return true; } catch (err) {}
    }
    return false;
  }
  function statePayload() {
    return {
      nodeCount: nodes.length,
      edgeCount: edges.length,
      graphData: JSON.stringify(exportData())
    };
  }
  function syncState() { busEmit('state-change', statePayload()); }

  function attachBusListeners() {
    var b = bus();
    if (b && typeof b.on === 'function') {
      try {
        b.on('MindMap', 'load-graph', function (data) {
          loadGraphJSON(data);
          showStatus('Graph loaded from SubkernelBus');
        });

        // Canonical channel used by the rest of the subkernel.
        b.on('Diagrammer', 'load-graph', function (data) {
          loadGraphJSON(data && data.graph ? data.graph : data);
          showStatus('Graph loaded from SubkernelBus');
        });

        // Notepad → Diagrammer: text becomes a node graph.
        b.on('Diagrammer', 'load-source', function (p) {
          graphFromText(p && p.source, p && p.name);
        });

        // Explorer → Diagrammer: turn a real directory tree into a diagram.
        b.on('Diagrammer', 'diagram-path', function (p) {
          graphFromPath(p && p.path);
        });

        // Shell routes an opened file here by app id.
        b.on('mermaid', 'open-file', function (p) {
          if (!p || !p.path) return;
          var K = window.SubkernelBridge;
          if (/\.(json|mmd|mermaid)$/i.test(p.path) && K) {
            K.invoke('read_text_file', { path: p.path })
              .then(function (t) {
                try { loadGraphJSON(t); }
                catch (e) { graphFromText(t, p.path); }
              })
              .catch(function (e) { showStatus(String(e)); });
          } else {
            graphFromPath(p.path);
          }
        });

        b.on('Diagrammer', 'query', function () {
          busEmit('query:reply', statePayload());
        });
      } catch (err) {}
    }
    var live = b && typeof b.emit === 'function';
    busLabelEl.textContent = live ? 'BUS ● live' : 'BUS offline';
    busLabelEl.classList.toggle('live', !!live);
    if (live) busEmit('ready', { nodeCount: nodes.length, app: 'Subkernel Diagrammer' });
  }

  // Build a graph from plain text: blank-line separated blocks become nodes,
  // chained head-to-tail so pasted notes arrive as an editable spine.
  function graphFromText(source, name) {
    if (!source) { showStatus('load-source: empty'); return; }
    var blocks = String(source).split(/\n\s*\n/).map(function (s) { return s.trim(); })
                   .filter(Boolean).slice(0, 40);
    var g = { nodes: [], edges: [] };
    if (name) {
      g.nodes.push({ id: 0, title: String(name).split(/[\\/]/).pop(), text: 'source document', x: 60, y: 40 });
    }
    blocks.forEach(function (blk, i) {
      var lines = blk.split('\n');
      g.nodes.push({
        id: i + 1,
        title: lines[0].slice(0, 48),
        text: lines.slice(1).join('\n').slice(0, 400),
        x: 60 + (i % 3) * 330,
        y: 150 + Math.floor(i / 3) * 190
      });
      if (i > 0) g.edges.push({ id: i, from: i, to: i + 1 });
      else if (name) g.edges.push({ id: 0, from: 0, to: 1 });
    });
    loadGraphJSON(g);
    showStatus('Diagrammed ' + blocks.length + ' blocks from source');
  }

  // Build a graph from a real directory listing via the native kernel.
  function graphFromPath(path) {
    var K = window.SubkernelBridge;
    if (!path || !K || !K.hasKernel) { showStatus('diagram-path: kernel offline'); return; }
    showStatus('Reading ' + path + '…');
    K.invoke('read_directory', { path: path }).then(function (entries) {
      var items = entries.slice(0, 36);
      var g = {
        nodes: [{ id: 0, title: String(path).split(/[\\/]/).filter(Boolean).pop() || path,
                  text: path + '\n' + entries.length + ' items', x: 60, y: 40 }],
        edges: []
      };
      items.forEach(function (e, i) {
        g.nodes.push({
          id: i + 1,
          title: (e.is_dir ? '📁 ' : '📄 ') + e.name.slice(0, 40),
          text: e.is_dir ? 'directory' : (e.size + ' bytes'),
          x: 60 + (i % 4) * 300,
          y: 200 + Math.floor(i / 4) * 150
        });
        g.edges.push({ id: i, from: 0, to: i + 1 });
      });
      loadGraphJSON(g);
      showStatus('Diagrammed ' + items.length + ' entries from ' + path);
    }).catch(function (e) { showStatus(String(e)); });
  }

  // ==================== data model ====================
  function exportData() {
    return {
      app: 'Subkernel Diagrammer',
      version: 1,
      nodes: nodes.map(function (n) {
        return { id: n.id, title: n.title, text: n.text, x: n.x, y: n.y };
      }),
      edges: edges.map(function (e) {
        return { id: e.id, from: e.from, to: e.to };
      })
    };
  }

  function loadGraphJSON(data) {
    var parsed = data;
    if (typeof data === 'string') {
      try { parsed = JSON.parse(data); } catch (err) { showStatus('load-graph: invalid JSON'); return; }
    }
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.nodes)) {
      showStatus('load-graph: expected { nodes: [...] }');
      return;
    }
    pushHistory();
    cancelEdit();
    pendingConn = null;
    drag = null;
    selection = null;
    nodes = [];
    edges = [];
    nextId = 1;
    nextEdgeId = 1;
    var idMap = {};
    for (var i = 0; i < parsed.nodes.length; i++) {
      var r = parsed.nodes[i];
      idMap[String(r.id)] = nextId;
      nodes.push({
        id: nextId++,
        title: String(r.title != null ? r.title : 'Node'),
        text: String(r.text != null ? r.text : ''),
        x: Number(r.x) || 0,
        y: Number(r.y) || 0
      });
    }
    for (var j = 0; j < (parsed.edges || []).length; j++) {
      var re = parsed.edges[j];
      var f = idMap[String(re.from)];
      var t = idMap[String(re.to)];
      if (f && t && f !== t) edges.push({ id: nextEdgeId++, from: f, to: t, fromPort: 'out', toPort: 'in' });
    }
    renderAll();
    syncState();
    showStatus('Loaded ' + nodes.length + ' nodes, ' + edges.length + ' links');
  }

  // ==================== text measurement / layout ====================
  function truncateText(s, maxW, font) {
    measureCtx.font = font;
    s = String(s);
    if (measureCtx.measureText(s).width <= maxW) return s;
    var t = s;
    while (t.length > 1 && measureCtx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  function wrapText(text, maxWidth) {
    measureCtx.font = '11px Tahoma, "Segoe UI", sans-serif';
    var lines = [];
    var rawLines = String(text).split('\n');
    for (var li = 0; li < rawLines.length; li++) {
      var raw = rawLines[li];
      if (raw === '') { lines.push(''); continue; }
      var words = raw.split(/\s+/);
      var cur = '';
      for (var i = 0; i < words.length; i++) {
        var trial = cur ? cur + ' ' + words[i] : words[i];
        if (cur && measureCtx.measureText(trial).width > maxWidth) {
          lines.push(cur);
          cur = words[i];
        } else {
          cur = trial;
        }
      }
      lines.push(cur);
    }
    return lines;
  }

  function computeNodeSize(node) {
    node.titleDisplay = truncateText(node.title || 'Node', 128, 'bold 11px Tahoma, "Segoe UI", sans-serif');
    var prelim = wrapText(node.text || '', 140);
    var maxW = 0;
    measureCtx.font = '11px Tahoma, "Segoe UI", sans-serif';
    for (var i = 0; i < prelim.length; i++) maxW = Math.max(maxW, measureCtx.measureText(prelim[i]).width);
    node.w = Math.max(150, Math.min(340, Math.ceil(maxW) + 24));
    node.bodyLines = wrapText(node.text || '', node.w - 16);
    node.h = 22 + 6 + node.bodyLines.length * 15 + 6;
  }

  function portPos(node, side) {
    return side === 'in'
      ? { x: node.x, y: node.y + node.h / 2 }
      : { x: node.x + node.w, y: node.y + node.h / 2 };
  }

  // ==================== rendering ====================
  function port(node, side, px, py) {
    var c = mk('circle', { cx: px, cy: py, r: 5.5, 'class': 'port', 'data-nid': node.id, 'data-side': side });
    var tip = document.createElementNS(NS, 'title');
    tip.textContent = side === 'in' ? 'Input — drag to connect' : 'Output — drag to connect';
    c.appendChild(tip);
    return c;
  }

  function renderNode(node) {
    var g = node.g || (node.g = mk('g', {}));
    while (g.firstChild) g.removeChild(g.firstChild);
    g.setAttribute('class', 'node-g' + (isNodeSel(node) ? ' selected' : ''));
    g.setAttribute('data-nid', node.id);
    g.setAttribute('transform', 'translate(' + node.x + ',' + node.y + ')');
    g.setAttribute('filter', 'url(#nodeShadow)');

    var w = node.w, h = node.h, headH = 22;

    var header = mk('rect', { x: 0, y: 0, width: w, height: headH, class: 'node-title-bg' });
    g.appendChild(header);
    g.appendChild(mk('rect', { x: 0.5, y: 0.5, width: w - 1, height: 1.5, class: 'head-hi' }));
    g.appendChild(mk('rect', { x: 0, y: headH - 1.5, width: w, height: 1.5, class: 'head-lo' }));

    var title = mk('text', { x: w / 2, y: 15.5, 'text-anchor': 'middle', class: 'node-title' });
    title.textContent = node.titleDisplay;
    g.appendChild(title);

    g.appendChild(mk('rect', { x: 0, y: headH, width: w, height: h - headH, class: 'node-body' }));
    g.appendChild(mk('rect', { x: 1, y: headH + 1, width: w - 2, height: 1, class: 'body-hi' }));
    g.appendChild(mk('rect', { x: 1, y: h - 1.5, width: w - 2, height: 1.5, class: 'body-shade' }));
    g.appendChild(mk('rect', { x: w - 1.5, y: headH + 1, width: 1.5, height: h - headH - 2, class: 'body-shade' }));

    var bt = document.createElementNS(NS, 'text');
    bt.setAttribute('class', 'node-text');
    var lines = node.bodyLines;
    for (var i = 0; i < lines.length; i++) {
      var ts = document.createElementNS(NS, 'tspan');
      ts.setAttribute('x', 8);
      ts.setAttribute('dy', i === 0 ? headH + 18 : 15);
      ts.textContent = lines[i] || ' ';
      bt.appendChild(ts);
    }
    g.appendChild(bt);

    if (!String(node.text || '').trim()) {
      var ph = mk('text', { x: 8, y: headH + 18, class: 'node-placeholder' });
      ph.textContent = 'Double-click to add notes…';
      g.appendChild(ph);
    }

    var cb = mk('g', { class: 'node-close' });
    cb.appendChild(mk('rect', { x: w - 17, y: 4.5, width: 13, height: 13, rx: 2, class: 'close-bg' }));
    var ct = mk('text', { x: w - 10.5, y: 14.6, 'text-anchor': 'middle', class: 'close-x' });
    ct.textContent = '✕';
    cb.appendChild(ct);
    g.appendChild(cb);

    g.appendChild(port(node, 'in', 0, h / 2));
    g.appendChild(port(node, 'out', w, h / 2));

    if (g.parentNode !== nodesG) nodesG.appendChild(g);
  }

  function edgePath(e) {
    var a = nodeById(e.from), b = nodeById(e.to);
    if (!a || !b) return '';
    var p1 = portPos(a, e.fromPort || 'out');
    var p2 = portPos(b, e.toPort || 'in');
    var vx = p2.x - p1.x, vy = p2.y - p1.y;
    var len = Math.sqrt(vx * vx + vy * vy) || 1;
    var ux = vx / len, uy = vy / len;
    var s = { x: p1.x + ux * 6, y: p1.y + uy * 6 };
    var t = { x: p2.x - ux * 12, y: p2.y - uy * 12 };
    var dx = Math.max(24, Math.abs(t.x - s.x) * 0.5);
    return 'M ' + s.x + ',' + s.y +
      ' C ' + (s.x + dx) + ',' + s.y +
      ' ' + (t.x - dx) + ',' + t.y +
      ' ' + t.x + ',' + t.y;
  }

  function renderEdge(e) {
    var d = edgePath(e);
    var hit = mk('path', { d: d, class: 'edge-hit', 'data-eid': e.id });
    var sel = isEdgeSel(e);
    var vis = mk('path', {
      d: d,
      class: 'edge' + (sel ? ' selected' : ''),
      'marker-end': sel ? 'url(#arrowSel)' : 'url(#arrow)'
    });
    edgesG.appendChild(hit);
    edgesG.appendChild(vis);
    e.hit = hit;
    e.vis = vis;
  }

  function renderEdges() {
    while (edgesG.firstChild) edgesG.removeChild(edgesG.firstChild);
    for (var i = 0; i < edges.length; i++) renderEdge(edges[i]);
  }

  function updateEdgesForNode(node) {
    for (var i = 0; i < edges.length; i++) {
      var e = edges[i];
      if (e.from === node.id || e.to === node.id) {
        var d = edgePath(e);
        if (e.hit) e.hit.setAttribute('d', d);
        if (e.vis) e.vis.setAttribute('d', d);
      }
    }
  }

  function updateCounts() { countLabelEl.textContent = nodes.length + ' nodes · ' + edges.length + ' links'; }

  function applyView() {
    worldG.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.scale + ')');
    zoomLabelEl.textContent = Math.round(view.scale * 100) + '%';
  }

  function renderAll() {
    for (var i = 0; i < nodes.length; i++) computeNodeSize(nodes[i]);
    while (nodesG.firstChild) nodesG.removeChild(nodesG.firstChild);
    for (var j = 0; j < nodes.length; j++) renderNode(nodes[j]);
    renderEdges();
    updateCounts();
  }

  function buildGrid() {
    var span = 30000;
    var minor = [], major = [];
    for (var i = -span; i <= span; i += GRID) {
      var line = 'M' + i + ' ' + (-span) + ' V' + span + ' M' + (-span) + ' ' + i + ' H' + span;
      (i % 100 === 0 ? major : minor).push(line);
    }
    gridMinor.setAttribute('d', minor.join(''));
    gridMajor.setAttribute('d', major.join(''));
  }

  // ==================== history (undo/redo) ====================
  function pushHistory() {
    history = history.slice(0, historyIndex + 1);
    history.push(JSON.stringify(exportData()));
    if (history.length > 60) history.shift();
    historyIndex = history.length - 1;
  }

  function applySnapshot(json) {
    var p = JSON.parse(json);
    cancelEdit();
    pendingConn = null;
    drag = null;
    selection = null;
    nodes = [];
    edges = [];
    nextId = 1;
    nextEdgeId = 1;
    var idMap = {};
    for (var i = 0; i < p.nodes.length; i++) {
      var r = p.nodes[i];
      idMap[String(r.id)] = nextId;
      nodes.push({ id: nextId++, title: r.title, text: r.text, x: r.x, y: r.y });
    }
    for (var j = 0; j < (p.edges || []).length; j++) {
      var re = p.edges[j];
      var f = idMap[String(re.from)], t = idMap[String(re.to)];
      if (f && t && f !== t) edges.push({ id: nextEdgeId++, from: f, to: t, fromPort: 'out', toPort: 'in' });
    }
    renderAll();
    syncState();
  }

  function undo() {
    if (historyIndex > 0) { historyIndex--; applySnapshot(history[historyIndex]); showStatus('Undo'); }
  }
  function redo() {
    if (historyIndex < history.length - 1) { historyIndex++; applySnapshot(history[historyIndex]); showStatus('Redo'); }
  }

  // ==================== node ops ====================
  function addNodeAt(x, y) {
    pushHistory();
    var node = { id: nextId++, title: 'New Node', text: '', x: snap(x), y: snap(y) };
    nodes.push(node);
    renderAll();
    setSelection({ type: 'node', id: node.id });
    syncState();
    startEdit(node.id, 'title');
    showStatus('Node added');
  }
  function addNodeUI() {
    var r = svgEl.getBoundingClientRect();
    var w = worldFromScreen(r.left + r.width / 2, r.top + r.height / 2);
    addNodeAt(w.x - 75, w.y - 12);
  }
  function duplicateNode(id) {
    var n = nodeById(id);
    if (!n) return;
    pushHistory();
    var copy = { id: nextId++, title: n.title + ' copy', text: n.text, x: n.x + 34, y: n.y + 34 };
    nodes.push(copy);
    renderAll();
    setSelection({ type: 'node', id: copy.id });
    syncState();
    showStatus('Node duplicated');
  }
  function deleteNode(id) {
    var n = nodeById(id);
    if (!n) return;
    pushHistory();
    nodes = nodes.filter(function (x) { return x.id !== id; });
    edges = edges.filter(function (e) { return e.from !== id && e.to !== id; });
    if (selection && selection.type === 'node' && selection.id === id) selection = null;
    renderAll();
    syncState();
    showStatus('Node deleted');
  }
  function deleteEdge(id) {
    pushHistory();
    edges = edges.filter(function (e) { return e.id !== id; });
    if (selection && selection.type === 'edge' && selection.id === id) selection = null;
    renderAll();
    syncState();
    showStatus('Link deleted');
  }
  function clearAll() {
    if (!nodes.length) { showStatus('Graph already empty'); return; }
    if (!window.confirm('Clear the entire diagram?')) return;
    pushHistory();
    nodes = []; edges = [];
    selection = null;
    cancelEdit();
    renderAll();
    syncState();
    showStatus('Diagram cleared');
  }

  // ==================== selection ====================
  function setSelection(sel) {
    if (selection) {
      if (selection.type === 'node') {
        var n = nodeById(selection.id);
        if (n && n.g) n.g.classList.remove('selected');
      } else {
        var e = edgeById(selection.id);
        if (e && e.vis) { e.vis.classList.remove('selected'); e.vis.setAttribute('marker-end', 'url(#arrow)'); }
      }
    }
    selection = sel;
    if (selection) {
      if (selection.type === 'node') {
        var n2 = nodeById(selection.id);
        if (n2 && n2.g) n2.g.classList.add('selected');
      } else {
        var e2 = edgeById(selection.id);
        if (e2 && e2.vis) { e2.vis.classList.add('selected'); e2.vis.setAttribute('marker-end', 'url(#arrowSel)'); }
      }
    }
  }

  // ==================== inline editing ====================
  function startEdit(id, mode) {
    cancelEdit();
    var n = nodeById(id);
    if (!n) return;
    editNodeId = id;
    editMode = mode;
    editorFO.setAttribute('x', n.x + 1);
    editorFO.setAttribute('y', n.y + 1);
    editorFO.setAttribute('width', Math.max(10, n.w - 2));
    editorFO.setAttribute('height', Math.max(10, n.h - 2));
    editorBox.setAttribute('class', 'node-editor ' + mode);
    editorBox.textContent = mode === 'title' ? (n.title || '') : (n.text || '');
    editorFO.style.display = 'block';
    editorBox.focus();
    var range = document.createRange();
    range.selectNodeContents(editorBox);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function commitEdit() {
    if (editNodeId == null) return;
    var n = nodeById(editNodeId);
    var val = editorBox.innerText != null ? editorBox.innerText : editorBox.textContent;
    val = val.replace(/\u00a0/g, ' ');
    var changed = false;
    if (editMode === 'title') {
      var t = val.replace(/\n/g, ' ').trim();
      if (t && t !== n.title) { pushHistory(); n.title = t; changed = true; }
    } else {
      if (val !== n.text) { pushHistory(); n.text = val; changed = true; }
    }
    hideEditor();
    editNodeId = null;
    editMode = null;
    if (changed) {
      computeNodeSize(n);
      renderNode(n);
      updateEdgesForNode(n);
      updateCounts();
      syncState();
      showStatus('Node updated');
    }
  }
  function cancelEdit() {
    hideEditor();
    editNodeId = null;
    editMode = null;
  }
  function hideEditor() { editorFO.style.display = 'none'; }

  // ==================== connections ====================
  function startConn(nodeId, side, cx, cy) {
    if (pendingConn) return;
    pendingConn = { fromId: nodeId, fromSide: side };
    updateTemp(cx, cy);
  }
  function updateTemp(cx, cy) {
    if (!pendingConn) { tempPath.setAttribute('d', ''); return; }
    var n = nodeById(pendingConn.fromId);
    var p = portPos(n, pendingConn.fromSide);
    var wp = worldFromScreen(cx, cy);
    var dx = Math.max(24, Math.abs(wp.x - p.x) * 0.5);
    var dir = pendingConn.fromSide === 'in' ? -1 : 1;
    tempPath.setAttribute('d',
      'M ' + p.x + ',' + p.y +
      ' C ' + (p.x + dx * dir) + ',' + p.y +
      ' ' + (wp.x - dx * dir) + ',' + wp.y +
      ' ' + wp.x + ',' + wp.y);
  }
  function cancelConn() {
    pendingConn = null;
    tempPath.setAttribute('d', '');
  }
  function finishConn(e) {
    var fromId = pendingConn.fromId;
    cancelConn();
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var portEl = el && el.closest ? el.closest('.port') : null;
    var nodeEl = el && el.closest ? el.closest('.node-g') : null;
    var toId = portEl ? Number(portEl.getAttribute('data-nid')) : (nodeEl ? Number(nodeEl.getAttribute('data-nid')) : null);
    if (!toId || !nodeById(toId)) return;
    if (toId === fromId) { showStatus('A node cannot link to itself'); return; }
    for (var i = 0; i < edges.length; i++) {
      if (edges[i].from === fromId && edges[i].to === toId) { showStatus('That link already exists'); return; }
    }
    pushHistory();
    var e2 = { id: nextEdgeId++, from: fromId, to: toId, fromPort: 'out', toPort: 'in' };
    edges.push(e2);
    renderEdges();
    setSelection({ type: 'edge', id: e2.id });
    syncState();
    showStatus('Linked node ' + fromId + ' → node ' + toId);
  }

  // ==================== view transforms ====================
  function worldFromScreen(cx, cy) {
    var r = svgEl.getBoundingClientRect();
    return { x: (cx - r.left - view.x) / view.scale, y: (cy - r.top - view.y) / view.scale };
  }
  function zoomAt(cx, cy, factor) {
    var r = svgEl.getBoundingClientRect();
    var mx = cx - r.left, my = cy - r.top;
    var wx = (mx - view.x) / view.scale;
    var wy = (my - view.y) / view.scale;
    var s2 = Math.max(0.2, Math.min(3, view.scale * factor));
    view.scale = s2;
    view.x = mx - wx * s2;
    view.y = my - wy * s2;
    applyView();
  }
  function zoomBy(f) {
    var r = svgEl.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, f);
  }
  function resetView() {
    view = { x: 40, y: 40, scale: 1 };
    applyView();
  }

  // ==================== context menu ====================
  function showMenu(x, y, items) {
    while (ctxMenuEl.firstChild) ctxMenuEl.removeChild(ctxMenuEl.firstChild);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it === '---') {
        var hr = document.createElement('div');
        hr.className = 'menu-sep';
        ctxMenuEl.appendChild(hr);
      } else {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = it.label;
        b.addEventListener('click', function (fn) {
          return function () { hideMenu(); fn(); };
        }(it.fn));
        ctxMenuEl.appendChild(b);
      }
    }
    ctxMenuEl.classList.remove('hidden');
    var mw = ctxMenuEl.offsetWidth, mh = ctxMenuEl.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    ctxMenuEl.style.left = Math.min(x, vw - mw - 4) + 'px';
    ctxMenuEl.style.top = Math.min(y, vh - mh - 4) + 'px';
  }
  function hideMenu() { ctxMenuEl.classList.add('hidden'); }
  document.addEventListener('mousedown', function (e) {
    if (!ctxMenuEl.classList.contains('hidden') && !ctxMenuEl.contains(e.target)) hideMenu();
  });

  // ==================== export / bus ====================
  function exportJSON() {
    var data = JSON.stringify(exportData(), null, 2);
    var fail = function () {
      modalTextEl.value = data;
      modalEl.classList.remove('hidden');
      modalTextEl.focus();
      modalTextEl.select();
      showStatus('Clipboard unavailable — copy from the dialog');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(
        function () { showStatus('Graph exported to clipboard'); },
        fail
      );
    } else {
      fail();
    }
  }
  function copyModal() {
    navigator.clipboard && navigator.clipboard.writeText(modalTextEl.value);
    closeModal();
    showStatus('Graph JSON copied to clipboard');
  }
  function closeModal() { modalEl.classList.add('hidden'); }
  function syncBus() {
    var payload = statePayload();
    var ok = busEmit('state-change', payload);
    if (ok) {
      busLabelEl.textContent = 'BUS ● live';
      busLabelEl.classList.add('live');
      showStatus('Synced to SubkernelBus · ' + payload.nodeCount + ' nodes pushed on MindMap channel');
    } else {
      showStatus('No SubkernelBus available (window.subkernel / window.parent.subkernel)');
    }
  }

  // ==================== mouse / keyboard ====================
  function updateCursor() {
    if (pan) svgEl.classList.add('panning');
    else svgEl.classList.remove('panning');
  }

  svgEl.addEventListener('mousedown', function (e) {
    if (e.button === 2) return;
    if (e.button === 1) e.preventDefault();
    hideMenu();

    var target = e.target;
    var closeBtn = target.closest ? target.closest('.node-close') : null;
    var portEl = target.closest ? target.closest('.port') : null;
    var edgeEl = target.closest ? target.closest('.edge-hit') : null;
    var nodeG = target.closest ? target.closest('.node-g') : null;

    if (e.button === 1 || (e.button === 0 && spaceHeld)) {
      pan = { sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
      updateCursor();
      return;
    }
    if (closeBtn) {
      deleteNode(Number(closeBtn.getAttribute('data-nid')));
      return;
    }
    if (portEl) {
      startConn(Number(portEl.getAttribute('data-nid')), portEl.getAttribute('data-side'), e.clientX, e.clientY);
      return;
    }
    if (edgeEl) {
      setSelection({ type: 'edge', id: Number(edgeEl.getAttribute('data-eid')) });
      return;
    }
    if (nodeG) {
      var id = Number(nodeG.getAttribute('data-nid'));
      var n = nodeById(id);
      setSelection({ type: 'node', id: id });
      if (n.g.parentNode !== nodesG) nodesG.appendChild(n.g);
      pushHistory();
      drag = { id: id, sx: e.clientX, sy: e.clientY, nx: n.x, ny: n.y };
      document.body.classList.add('dragging-node');
      return;
    }
    setSelection(null);
  });

  window.addEventListener('mousemove', function (e) {
    if (pan) {
      view.x = pan.ox + (e.clientX - pan.sx);
      view.y = pan.oy + (e.clientY - pan.sy);
      applyView();
      return;
    }
    if (drag) {
      var n = nodeById(drag.id);
      if (!n) return;
      var w = worldFromScreen(e.clientX, e.clientY);
      var w0 = worldFromScreen(drag.sx, drag.sy);
      n.x = snap(drag.nx + (w.x - w0.x));
      n.y = snap(drag.ny + (w.y - w0.y));
      n.g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
      updateEdgesForNode(n);
      return;
    }
    if (pendingConn) updateTemp(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', function (e) {
    if (e.button === 2) return;
    if (pan) { pan = null; updateCursor(); return; }
    if (drag) {
      drag = null;
      document.body.classList.remove('dragging-node');
      syncState();
      return;
    }
    if (pendingConn) finishConn(e);
  });

  svgEl.addEventListener('dblclick', function (e) {
    var target = e.target;
    var nodeG = target.closest ? target.closest('.node-g') : null;
    if (nodeG) {
      var id = Number(nodeG.getAttribute('data-nid'));
      var cls = target.getAttribute ? (target.getAttribute('class') || '') : '';
      var isTitle = cls.indexOf('node-title') !== -1;
      setSelection({ type: 'node', id: id });
      startEdit(id, isTitle ? 'title' : 'text');
      return;
    }
    var w = worldFromScreen(e.clientX, e.clientY);
    addNodeAt(w.x, w.y);
  });

  svgEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var target = e.target;
    var nodeG = target.closest ? target.closest('.node-g') : null;
    var portEl = target.closest ? target.closest('.port') : null;
    var edgeEl = target.closest ? target.closest('.edge-hit') : null;
    if (nodeG && !portEl) {
      var id = Number(nodeG.getAttribute('data-nid'));
      setSelection({ type: 'node', id: id });
      showMenu(e.clientX, e.clientY, [
        { label: 'Edit', fn: function () { startEdit(id, 'text'); } },
        { label: 'Edit title', fn: function () { startEdit(id, 'title'); } },
        { label: 'Duplicate', fn: function () { duplicateNode(id); } },
        '---',
        { label: 'Delete node', fn: function () { deleteNode(id); } }
      ]);
    } else if (edgeEl) {
      var eid = Number(edgeEl.getAttribute('data-eid'));
      setSelection({ type: 'edge', id: eid });
      showMenu(e.clientX, e.clientY, [
        { label: 'Delete link', fn: function () { deleteEdge(eid); } }
      ]);
    } else {
      var w = worldFromScreen(e.clientX, e.clientY);
      showMenu(e.clientX, e.clientY, [
        { label: 'Add node here', fn: function () { addNodeAt(w.x, w.y); } },
        '---',
        { label: 'Clear all', fn: function () { clearAll(); } }
      ]);
    }
  });

  svgEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key === ' ') {
      if (editNodeId != null) return;
      spaceHeld = true;
      svgEl.classList.add('space-pan');
      e.preventDefault();
      return;
    }
    if (spaceHeld) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault();
      redo();
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && editNodeId == null) {
      if (selection) {
        e.preventDefault();
        if (selection.type === 'node') deleteNode(selection.id);
        else deleteEdge(selection.id);
      }
      return;
    }
    if (e.key === 'Escape') {
      if (editNodeId != null) { cancelEdit(); return; }
      hideMenu();
      cancelConn();
    }
  });

  window.addEventListener('keyup', function (e) {
    if (e.key === ' ') {
      spaceHeld = false;
      svgEl.classList.remove('space-pan');
    }
  });
  window.addEventListener('blur', function () {
    spaceHeld = false;
    svgEl.classList.remove('space-pan');
    pan = null;
    updateCursor();
  });

  // editor box events
  editorBox.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  editorBox.addEventListener('dblclick', function (e) { e.stopPropagation(); });
  editorBox.addEventListener('wheel', function (e) { e.stopPropagation(); });
  editorBox.addEventListener('contextmenu', function (e) { e.stopPropagation(); });
  editorBox.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    else if (e.key === 'Enter' && !e.shiftKey && (editMode === 'title' || e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      commitEdit();
    }
  });
  editorBox.addEventListener('blur', function () { commitEdit(); });

  // toolbar buttons: don't steal focus (prevents space/delete misfires)
  document.querySelectorAll('.xp-btn').forEach(function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  // modal close on backdrop
  modalEl.addEventListener('mousedown', function (e) {
    if (e.target === modalEl) closeModal();
  });

  // ==================== init ====================
  function loadSample() {
    nodes.push({ id: nextId++, title: 'Welcome', text: 'Welcome to the Subkernel Diagrammer.\n\nDouble-click any node to edit it. Drag the round anchors to link nodes together.', x: 80, y: 120 });
    nodes.push({ id: nextId++, title: 'Navigate', text: 'Hold Space or middle-drag to pan the canvas.\nScroll the wheel to zoom in and out.', x: 430, y: 40 });
    nodes.push({ id: nextId++, title: 'Subkernel Bus', text: 'Every change emits state-change on the MindMap channel.\nExport JSON copies the graph — Sync to Bus broadcasts it.', x: 430, y: 220 });
    edges.push({ id: nextEdgeId++, from: 1, to: 2, fromPort: 'out', toPort: 'in' });
    edges.push({ id: nextEdgeId++, from: 1, to: 3, fromPort: 'out', toPort: 'in' });
  }

  buildGrid();
  loadSample();
  renderAll();
  pushHistory();
  applyView();
  attachBusListeners();

  // public API for external hosts / the bus
  window.loadGraphJSON = loadGraphJSON;
  window.exportGraphData = exportData;
  window.subkernelDiagrammer = {
    getGraphData: exportData,
    loadGraph: loadGraphJSON,
    nodeCount: function () { return nodes.length; }
  };
  // UI handlers for toolbar / modal buttons
  window.addNodeUI = addNodeUI;
  window.undo = undo;
  window.redo = redo;
  window.exportJSON = exportJSON;
  window.syncBus = syncBus;
  window.zoomBy = zoomBy;
  window.resetView = resetView;
  window.clearAll = clearAll;
  window.copyModal = copyModal;
  window.closeModal = closeModal;
  window.startEdit = startEdit;
  window.deleteNode = deleteNode;
  window.duplicateNode = duplicateNode;
  window.addEventListener('resize', applyView);
})();
</script>
