<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#fff; font-family:"Tahoma", sans-serif; font-size:12px; overflow:hidden; }
        .toolbar { background:#f1efe2; padding:4px; border-bottom:1px solid #7f9db9; display:flex; gap:6px; align-items:center; }
        .address-bar { flex:1; border:1px solid #7f9db9; padding:2px 4px; font-size:11px; background:#fff; outline:none; }
        .xp-btn { background:#e1dfd3; border:1px solid #7f9db9; padding:2px 8px; font-size:11px; cursor:pointer; box-shadow: inset 1px 1px 0px #fff; }
        .xp-btn:active { box-shadow: inset 1px 1px 2px #808080; }
        .file-grid { width:100%; height:calc(100% - 32px); overflow-y:auto; padding:10px; box-sizing:border-box; display:grid; grid-template-columns:repeat(auto-fill, 75px); gap:16px; align-content:start; }
        .file-item { display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer; padding:4px; border:1px solid transparent; border-radius:3px; max-width:75px; }
        .file-item:hover { background:rgba(10,100,230,0.1); border:1px solid rgba(10,100,230,0.3); }
        .file-icon { font-size:32px; margin-bottom:4px; }
        .file-name { font-size:11px; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="xp-btn" onclick="goUp()">⬆️ Up</button>
        <input type="text" id="path-input" class="address-bar" value="." readonly>
        <button class="xp-btn" onclick="refresh()">🔄 Refresh</button>
    </div>
    <div class="file-grid" id="explorer-grid"></div>
    <script>
        let currentPath = '.';
        const fs = {
            '.': [
                { name:'System', is_dir:true },
                { name:'Users', is_dir:true },
                { name:'Documents', is_dir:true },
                { name:'AGENTS.md', is_dir:false },
                { name:'main.chorx', is_dir:false },
                { name:'readme.txt', is_dir:false }
            ],
            'System': [
                { name:'kernel.sys', is_dir:false },
                { name:'boot.cfg', is_dir:false },
                { name:'modules', is_dir:true }
            ],
            'Users': [
                { name:'admin', is_dir:true },
                { name:'guest', is_dir:true }
            ],
            'Documents': [
                { name:'notes.txt', is_dir:false },
                { name:'project.chorx', is_dir:false }
            ]
        };

        function refresh() {
            const grid = document.getElementById('explorer-grid');
            grid.innerHTML = '';
            const items = fs[currentPath] || [];
            if (items.length === 0) {
                grid.innerHTML = '<div style="color:#888;padding:10px;">This folder is empty.</div>';
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.ondblclick = () => handleItemClick(item.name, item.is_dir);
                div.innerHTML = `<div class="file-icon">${item.is_dir ? '📁' : '📄'}</div><div class="file-name">${item.name}</div>`;
                grid.appendChild(div);
            });
        }

        function goUp() {
            if (currentPath === '.' || currentPath === '/') return;
            let parts = currentPath.split('/'); parts.pop();
            currentPath = parts.join('/') || '.';
            document.getElementById('path-input').value = currentPath;
            refresh();
        }

        function handleItemClick(name, isDir) {
            if (isDir) {
                const newPath = currentPath === '.' ? name : currentPath + '/' + name;
                if (fs[newPath]) {
                    currentPath = newPath;
                    document.getElementById('path-input').value = currentPath;
                    refresh();
                }
            } else {
                window.parent.postMessage({ kernelAction: 'LAUNCH_WITH_FILE', targetApp: 'notepad', filename: currentPath === '.' ? name : currentPath + '/' + name }, '*');
            }
        }

        setTimeout(refresh, 100);
    </script>
</body>
</html>
