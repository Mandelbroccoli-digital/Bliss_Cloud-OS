<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#0a0c10; color:#c9d1d9; font-family:-apple-system,sans-serif; overflow:hidden; }
        #app { display:flex; flex-direction:column; height:100%; }
        .header { background:#161b22; border-bottom:1px solid #30363d; padding:14px 20px; display:flex; align-items:center; gap:12px; }
        .logo { font-size:28px; }
        .header h1 { font-size:18px; color:#f0f6fc; }
        .header .ver { color:#8b949e; font-size:12px; }
        #content { flex:1; overflow-y:auto; padding:20px; }
        .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; margin-bottom:14px; }
        .card h3 { color:#f0f6fc; font-size:14px; margin-bottom:8px; }
        .card p { color:#8b949e; font-size:12px; line-height:1.6; }
        .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .stat { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:12px; text-align:center; }
        .stat .val { font-size:24px; font-weight:bold; color:#3a82f2; }
        .stat .lbl { font-size:11px; color:#8b949e; margin-top:4px; }
        .module-list { display:flex; flex-direction:column; gap:8px; }
        .module { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#0d1117; border-radius:6px; border:1px solid #30363d; }
        .module .icon { font-size:20px; }
        .module .name { flex:1; font-size:13px; }
        .module .status { font-size:11px; padding:2px 8px; border-radius:10px; }
        .status.online { background:rgba(63,185,80,0.2); color:#3fb950; }
        .status.standby { background:rgba(255,183,3,0.2); color:#ffb703; }
        .btn { background:#3a82f2; border:none; color:#fff; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:12px; }
        .btn:hover { background:#5599ff; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <span class="logo">🌀</span>
        <div>
            <h1>Ouro-Hub <span class="ver">v0.0.9</span></h1>
            <div class="ver">Central module registry & kernel dashboard</div>
        </div>
    </div>
    <div id="content">
        <div class="card">
            <h3>Kernel Status</h3>
            <div class="stat-grid">
                <div class="stat"><div class="val" id="uptime">0s</div><div class="lbl">UPTIME</div></div>
                <div class="stat"><div class="val">14</div><div class="lbl">LOADED MODULES</div></div>
                <div class="stat"><div class="val">2.2B</div><div class="lbl">MALI RUNTIME</div></div>
                <div class="stat"><div class="val" id="mem">—</div><div class="lbl">MEMORY (MB)</div></div>
            </div>
        </div>
        <div class="card">
            <h3>Active Modules</h3>
            <div class="module-list" id="modules"></div>
        </div>
        <div class="card">
            <h3>Quick Actions</h3>
            <p style="margin-bottom:10px;">Launch or manage Bliss OS subsystems from here.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn" onclick="window.parent.postMessage({kernelAction:'LAUNCH_WITH_FILE',targetApp:'terminal'},'*')">Open Terminal</button>
                <button class="btn" onclick="window.parent.postMessage({kernelAction:'LAUNCH_WITH_FILE',targetApp:'settings'},'*')">Settings</button>
                <button class="btn" onclick="window.parent.postMessage({kernelAction:'LAUNCH_WITH_FILE',targetApp:'subkernel'},'*')">Subkernel</button>
            </div>
        </div>
    </div>
</div>
<script>
    const modules = [
        { icon:'🖥️', name:'File Explorer', status:'online' },
        { icon:'💻', name:'Terminal Shell', status:'online' },
        { icon:'📝', name:'Code Studio', status:'online' },
        { icon:'🎼', name:'Chorus Editor', status:'online' },
        { icon:'🌎', name:'Web Browser', status:'online' },
        { icon:'🎨', name:'Canvas Paint', status:'online' },
        { icon:'🎵', name:'Media Player', status:'online' },
        { icon:'📷', name:'Camera', status:'standby' },
        { icon:'🖼️', name:'Gallery', status:'online' },
        { icon:'🦙', name:'Ollama AI Bridge', status:'standby' },
        { icon:'⚙️', name:'Settings', status:'online' },
        { icon:'⚡', name:'Subkernel', status:'online' },
        { icon:'🌀', name:'Ouro-Hub', status:'online' },
        { icon:'📃', name:'Notepad', status:'online' }
    ];

    function renderModules() {
        const ml = document.getElementById('modules');
        ml.innerHTML = modules.map(m => `<div class="module"><span class="icon">${m.icon}</span><span class="name">${m.name}</span><span class="status ${m.status}">${m.status.toUpperCase()}</span></div>`).join('');
    }

    function updateStats() {
        document.getElementById('uptime').textContent = Math.floor(performance.now()/1000) + 's';
        if (performance.memory) document.getElementById('mem').textContent = Math.round(performance.memory.usedJSHeapSize/1048576);
    }

    renderModules();
    updateStats();
    setInterval(updateStats, 1000);
</script>
</body>
</html>
