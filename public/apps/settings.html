<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../subkernel-bus.js"></script>
<script src="../subkernel-bridge.js"></script>
<meta charset="UTF-8">
    <title>System Settings</title>
    <style>
        :root { --bg: #ece9d8; --border: #004eae; --panel: #fff; --text: #000; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: Tahoma, sans-serif; font-size: 11px; user-select: none; }
        .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%; box-sizing: border-box; }
        .group-box { border: 1px solid #999; border-radius: 3px; padding: 10px; background: var(--panel); position: relative; margin-top: 6px; }
        .group-title { position: absolute; top: -8px; left: 8px; background: var(--panel); padding: 0 4px; font-weight: bold; color: #003399; }
        .row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .row:last-child { margin-bottom: 0; }
        label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-bar { margin-top: auto; display: flex; justify-content: flex-end; gap: 6px; }
        button { padding: 4px 12px; border: 1px solid #7a7a7a; background: linear-gradient(to bottom, #fff 0%, #e0e0e0 100%); border-radius: 3px; cursor: pointer; }
        button:hover { border-color: var(--border); }
        button:active { background: #d0d0d0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="group-box">
            <span class="group-title">Hardware & Filesystem IPC</span>
            <div class="row"><label><input type="checkbox" id="fs-proxy" checked> Enable Native Local File Proxy</label></div>
            <div class="row"><label><input type="checkbox" id="audio-emu" checked> Realstream Audio Hardware Routing</label></div>
            <div class="row"><label><input type="checkbox" id="dev-mode"> Subkernel Verbose Debug Logging</label></div>
        </div>

        <div class="group-box">
            <span class="group-title">AI Bridge Configuration</span>
            <div class="row"><label><input type="checkbox" id="ollama-cors" checked> Bypass Ollama CORS via Rust Host</label></div>
            <div class="row">
                <span>Default Endpoint:</span>
                <input type="text" id="endpoint-url" value="http://localhost:11434" style="flex:1; padding:2px; font-family:Tahoma; font-size:11px;">
            </div>
        </div>

        <div class="btn-bar">
            <button onclick="applySettings()">Apply Changes</button>
        </div>
    </div>

    <script>
        async function applySettings() {
            const config = {
                fsProxy: document.getElementById('fs-proxy').checked,
                audioEmu: document.getElementById('audio-emu').checked,
                devMode: document.getElementById('dev-mode').checked,
                endpoint: document.getElementById('endpoint-url').value
            };

            if (window.parent && window.parent.__TAURI_INTERNALS__) {
                try {
                    await window.parent.__TAURI__.core.invoke('execute_shell_command', {
                        cmd: `echo Subkernel Config Updated: ${JSON.stringify(config)}`,
                        cwd: null
                    });
                } catch (e) { console.error("IPC Error:", e); }
            }
            alert("Subkernel environment parameters updated.");
        }
    </script>
</body>
</html>
