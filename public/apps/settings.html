<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#ece9d8; font-family:"Tahoma",sans-serif; font-size:12px; overflow:hidden; }
        #app { display:flex; flex-direction:column; height:100%; }
        .header { background:linear-gradient(to bottom,#0058e6,#3a82f2); color:#fff; padding:10px 16px; font-weight:bold; font-size:14px; display:flex; align-items:center; gap:8px; }
        #content { flex:1; overflow-y:auto; padding:16px; }
        .section { background:#fff; border:1px solid #7f9db9; border-radius:4px; margin-bottom:12px; }
        .section-title { background:#ece9d8; padding:6px 10px; font-weight:bold; border-bottom:1px solid #7f9db9; display:flex; align-items:center; gap:6px; }
        .row { padding:8px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e0ddd0; }
        .row:last-child { border-bottom:none; }
        .row label { font-size:12px; }
        .row .val { font-size:12px; color:#555; }
        input[type="range"] { width:120px; }
        input[type="color"] { width:40px; height:20px; border:1px solid #7f9db9; cursor:pointer; }
        select { font-size:11px; padding:2px; border:1px solid #7f9db9; }
        .toggle { width:36px; height:18px; background:#ccc; border-radius:9px; cursor:pointer; position:relative; transition:background 0.2s; }
        .toggle.on { background:#3a82f2; }
        .toggle::after { content:''; position:absolute; width:14px; height:14px; background:#fff; border-radius:50%; top:2px; left:2px; transition:left 0.2s; }
        .toggle.on::after { left:20px; }
        .btn { background:#e1dfd3; border:1px solid #7f9db9; padding:4px 12px; cursor:pointer; font-size:11px; }
        .btn:hover { background:#d4d0c4; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">⚙️ Bliss OS Settings</div>
    <div id="content">
        <div class="section">
            <div class="section-title">🖥️ Display</div>
            <div class="row"><label>Desktop wallpaper</label><input type="color" value="#1a4a8a" onchange="document.getElementById('wallpaper-val').textContent=this.value"><span class="val" id="wallpaper-val">#1a4a8a</span></div>
            <div class="row"><label>Brightness</label><input type="range" min="30" max="100" value="100" oninput="document.getElementById('bright-val').textContent=this.value+'%'"><span class="val" id="bright-val">100%</span></div>
            <div class="row"><label>Resolution</label><select><option>Auto (Window Size)</option><option>1920×1080</option><option>1280×720</option><option>800×600</option></select></div>
        </div>
        <div class="section">
            <div class="section-title">🔊 Sound</div>
            <div class="row"><label>Master volume</label><input type="range" min="0" max="100" value="75" oninput="document.getElementById('vol-val').textContent=this.value+'%'"><span class="val" id="vol-val">75%</span></div>
            <div class="row"><label>Mute all sounds</label><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
        </div>
        <div class="section">
            <div class="section-title">🌐 Network</div>
            <div class="row"><label>Wi-Fi</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
            <div class="row"><label>Network name</label><span class="val">BlissCloud-5G</span></div>
            <div class="row"><label>IP address</label><span class="val">192.168.1.42</span></div>
        </div>
        <div class="section">
            <div class="section-title">⚡ Kernel</div>
            <div class="row"><label>Kernel version</label><span class="val">BlissOS 0.0.9 Subkernel</span></div>
            <div class="row"><label>Mali runtime</label><span class="val">2.2B Local</span></div>
            <div class="row"><label>SML phase</label><span class="val">Citrinitas</span></div>
            <div class="row"><label>Subprocess limits</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
        </div>
        <div class="section">
            <div class="section-title">ℹ️ About</div>
            <div class="row"><label>OS</label><span class="val">Bliss OS v0.0.9</span></div>
            <div class="row"><label>Build</label><span class="val">2025.08.14</span></div>
            <div class="row"><label>Architecture</label><span class="val">WebAssembly / Cloud</span></div>
        </div>
    </div>
</div>
</body>
</html>
