<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../subkernel-bus.js"></script>
<script src="../subkernel-bridge.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Shell</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            padding-bottom: 8px;
            line-height: 1.4;
        }

        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prompt {
            color: #0088ff;
            font-weight: bold;
            white-space: nowrap;
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex: 1;
            caret-color: #00ff66;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: #1f3d2b;
            border-radius: 3px;
        }
        #output::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
    </style>
</head>
<body>

    <div id="output">Bliss_26 Native Subkernel Shell v0.1&#10;Type 'help' or execute host commands directly.&#10;</div>
    
    <div class="input-line">
        <span class="prompt" id="shell-prompt">subkernel@bliss:~$</span>
        <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" />
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('output');
        const promptElem = document.getElementById('shell-prompt');

        let currentCwd = null;

        document.body.addEventListener('click', () => input.focus());

        function appendOutput(text) {
            output.innerText += text + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function updatePromptDisplay() {
            const displayPath = currentCwd ? currentCwd : '~';
            promptElem.innerText = `subkernel@bliss:${displayPath}$`;
        }

        const localCommands = {
            'help': () => `BlissOS Subkernel Shell Utilities:
  sysinfo  - Print kernel, host bridge, and architecture status
  clear    - Flush terminal scrollback buffer
  chorus   - Status of ChorusDSL self-hosting runtime
  help     - Display this summary`,

            'sysinfo': () => {
                const hostBridge = (window.parent && window.parent.isTauri) 
                    ? 'Tauri v2 Native Host (Rust Core)' 
                    : 'Standard Web Browser (Simulation Mode)';
                return `[Subkernel Telemetry]
  Engine Host  : ${hostBridge}
  Architecture : march32 execution on x64 host
  Active Runtime: HIVE / ChorusDSL Self-Hosting Environment`;
            },

            'chorus': () => `ChorusDSL Runtime Status:
  Self-Hosting Pipeline: ACTIVE
  Editor Integration   : Direct Substrate Access
  Target Arch          : march32 (x64 host execution)`,

            'clear': () => {
                output.innerText = '';
                return null;
            }
        };

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (data && data.type === 'TERMINAL_RESP') {
                appendOutput(data.payload);
            }
        });

        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const rawCmd = input.value;
                const cmd = rawCmd.trim();
                input.value = '';

                if (!cmd) return;

                appendOutput(`${promptElem.innerText} ${cmd}`);

                // 1. Local utility commands
                if (localCommands[cmd]) {
                    const result = localCommands[cmd]();
                    if (result !== null) appendOutput(result);
                    return;
                }

                // 2. Client-side CD tracking
                if (cmd === 'cd' || cmd.startsWith('cd ')) {
                    const target = cmd.slice(2).trim();
                    if (!target || target === '~') {
                        currentCwd = null;
                    } else if (target === '..') {
                        if (currentCwd) {
                            const parts = currentCwd.replace(/\\/g, '/').split('/').filter(Boolean);
                            parts.pop();
                            currentCwd = parts.length > 0 ? parts.join('/') : '..';
                        } else {
                            currentCwd = '..';
                        }
                    } else {
                        currentCwd = currentCwd ? `${currentCwd}/${target}` : target;
                    }
                    updatePromptDisplay();
                    return;
                }

                // 3. Route to Tauri Native host
                if (window.parent && window.parent.__TAURI__ && window.parent.__TAURI__.core) {
                    try {
                        const res = await window.parent.__TAURI__.core.invoke('execute_shell_command', { 
                            cmd: cmd, 
                            cwd: currentCwd 
                        });
                        appendOutput(res);
                    } catch (err) {
                        appendOutput(`[TAURI_EXEC_ERR]: ${err}`);
                    }
                } 
                // 4. Fallback IPC trigger to Parent Desktop Bridge
                else if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({
                        kernelAction: 'FS_REQUEST',
                        windowId: 'terminal',
                        args: [cmd]
                    }, '*');
                } 
                // 5. Default web fallback
                else {
                    appendOutput(`[MOCK OS MODE]: Executed '${cmd}'`);
                }
            }
        });
    
    // ── subkernel bus wiring ──────────────────────────────────────
    (function(){
      const bus = window.subkernel;
      if (!bus) return;
      bus.on('Terminal', 'cd', ({ path }) => {
        if (!path) return;
        currentCwd = path;
        if (typeof updatePromptDisplay === 'function') updatePromptDisplay();
        appendOutput(`cd ${path}`);
      });
      bus.on('Terminal', 'exec', ({ command }) => {
        if (!command) return;
        input.value = command;
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      });
      bus.on('terminal', 'open-file', ({ path }) => {
        if (path) { currentCwd = path; if (typeof updatePromptDisplay === 'function') updatePromptDisplay(); }
      });
    })();
</script>
</body>
</html>
