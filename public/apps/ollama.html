<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#0d1117; color:#c9d1d9; font-family:-apple-system,sans-serif; overflow:hidden; display:flex; flex-direction:column; }
        .header { background:#161b22; border-bottom:1px solid #30363d; padding:14px 20px; display:flex; align-items:center; gap:10px; }
        .header h1 { font-size:16px; color:#f0f6fc; }
        #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:80%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; }
        .msg.user { background:#3a82f2; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
        .msg.ai { background:#161b22; border:1px solid #30363d; align-self:flex-start; border-bottom-left-radius:4px; }
        .msg.ai .model { font-size:10px; color:#8b949e; margin-bottom:4px; }
        .typing { color:#8b949e; font-size:12px; align-self:flex-start; padding:0 14px; }
        #input-bar { background:#161b22; border-top:1px solid #30363d; padding:12px 16px; display:flex; gap:10px; align-items:center; }
        #input { flex:1; background:#0d1117; border:1px solid #30363d; color:#f0f6fc; padding:8px 12px; border-radius:6px; font-size:13px; outline:none; }
        #input:focus { border-color:#3a82f2; }
        .send-btn { background:#3a82f2; border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; }
        .send-btn:hover { background:#5599ff; }
        .send-btn:disabled { opacity:0.5; cursor:default; }
        .model-bar { background:#161b22; padding:8px 16px; border-bottom:1px solid #30363d; display:flex; gap:8px; align-items:center; font-size:12px; }
        .model-select { background:#0d1117; border:1px solid #30363d; color:#f0f6fc; padding:4px 8px; border-radius:4px; font-size:12px; }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size:24px;">🦙</span>
        <h1>Ollama AI Bridge</h1>
    </div>
    <div class="model-bar">
        <span>Model:</span>
        <select class="model-select" id="model-select">
            <option value="llama3.2">llama3.2</option>
            <option value="llama3.1">llama3.1</option>
            <option value="mistral">mistral</option>
            <option value="phi3">phi3</option>
            <option value="qwen2.5">qwen2.5</option>
        </select>
        <span style="color:#8b949e;margin-left:auto;" id="conn-status">● Disconnected (simulation mode)</span>
    </div>
    <div id="chat">
        <div class="msg ai"><div class="model">Ollama Bridge</div>Welcome to the Ollama AI Bridge. I'm running in simulation mode — no Ollama server detected. I'll respond with simulated completions. Type a message to begin!</div>
    </div>
    <div id="input-bar">
        <input type="text" id="input" placeholder="Send a message..." onkeydown="if(event.key==='Enter')send()">
        <button class="send-btn" onclick="send()">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const modelSelect = document.getElementById('model-select');
        let busy = false;

        function addMsg(text, role, model) {
            const d = document.createElement('div');
            d.className = 'msg ' + role;
            if (role === 'ai') {
                d.innerHTML = `<div class="model">${model || 'Ollama'}</div>${text}`;
            } else {
                d.textContent = text;
            }
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const d = document.createElement('div');
            d.className = 'typing'; d.id = 'typing-indicator';
            d.textContent = '● ● ●';
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }
        function removeTyping() { const t = document.getElementById('typing-indicator'); if (t) t.remove(); }

        async function send() {
            if (busy) return;
            const text = input.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            input.value = '';
            busy = true;
            addTyping();

            const model = modelSelect.value;
            setTimeout(() => {
                removeTyping();
                const responses = [
                    `[${model}] Processing your request: "${text}". In simulation mode, I generate plausible responses based on the input context. To connect a real Ollama instance, run 'ollama serve' on localhost:11434.`,
                    `[${model}] I understand you're asking about: "${text}". This is a simulated response. The Ollama bridge supports any model installed locally — just select it from the dropdown above.`,
                    `[${model}] Received: "${text}". Simulation mode active. In a production setup, this response would come from your local Ollama model running entirely on-device with no cloud calls.`,
                    `[${model}] Query acknowledged: "${text}". The bridge protocol uses JSON-RPC over HTTP to communicate with the Ollama daemon. Responses stream token-by-token in production mode.`
                ];
                addMsg(responses[Math.floor(Math.random()*responses.length)], 'ai', model);
                busy = false;
            }, 800 + Math.random() * 1200);
        }
    </script>
</body>
</html>
