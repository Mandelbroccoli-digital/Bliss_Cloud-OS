<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin:0; padding:0; height:100%; display:flex; flex-direction:column; background:#1a1a2e; color:#fff; font-family:sans-serif; }
        #display { flex:1; display:flex; align-items:center; justify-content:center; background:#0d0d1a; overflow:hidden; position:relative; }
        #visualizer { position:absolute; width:100%; height:100%; }
        .controls { background:#16213e; padding:12px 16px; display:flex; align-items:center; gap:12px; border-top:1px solid #30475e; }
        .ctrl-btn { background:transparent; border:1px solid #30475e; color:#fff; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
        .ctrl-btn:hover { background:#30475e; }
        .ctrl-btn.play { background:#3a82f2; border-color:#3a82f2; }
        #track-info { flex:1; text-align:center; }
        #track-title { font-size:14px; font-weight:bold; }
        #track-artist { font-size:12px; color:#8b949e; }
        #progress { width:100%; height:4px; background:#30475e; border-radius:2px; margin-top:6px; cursor:pointer; }
        #progress-bar { height:100%; background:#3a82f2; border-radius:2px; width:0%; transition:width 0.1s; }
        .playlist { background:#16213e; padding:8px; max-height:140px; overflow-y:auto; border-top:1px solid #30475e; }
        .track { padding:6px 10px; cursor:pointer; font-size:12px; border-radius:4px; display:flex; justify-content:space-between; }
        .track:hover { background:rgba(255,255,255,0.08); }
        .track.active { background:rgba(58,130,242,0.2); color:#3a82f2; }
    </style>
</head>
<body>
    <div id="display">
        <canvas id="visualizer"></canvas>
        <div style="position:relative;z-index:1;text-align:center;">
            <div style="font-size:48px;margin-bottom:8px;">🎵</div>
            <div id="now-playing" style="font-size:18px;font-weight:bold;">Bliss Player</div>
            <div style="color:#8b949e;font-size:12px;">Upload audio to begin</div>
        </div>
    </div>
    <div class="playlist" id="playlist"></div>
    <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <button class="ctrl-btn play" onclick="togglePlay()" id="play-btn">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        <div id="track-info">
            <div id="track-title">No track loaded</div>
            <div id="track-artist">Upload an audio file</div>
            <div id="progress" onclick="seek(event)">
                <div id="progress-bar"></div>
            </div>
        </div>
        <label class="ctrl-btn" style="cursor:pointer;">📁<input type="file" accept="audio/*" multiple style="display:none;" onchange="loadFiles(this.files)"></label>
    </div>
    <script>
        const audio = new Audio();
        const tracks = [];
        let currentTrack = -1;
        let isPlaying = false;
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let audioCtx, analyser, dataArray, animId;

        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function loadFiles(files) {
            for (const f of files) {
                tracks.push({ name: f.name.replace(/\.[^.]+$/,''), artist: 'Local File', url: URL.createObjectURL(f) });
            }
            renderPlaylist();
            if (currentTrack === -1 && tracks.length > 0) playTrack(0);
        }

        function renderPlaylist() {
            const pl = document.getElementById('playlist');
            pl.innerHTML = '';
            tracks.forEach((t, i) => {
                const d = document.createElement('div');
                d.className = 'track' + (i === currentTrack ? ' active' : '');
                d.innerHTML = `<span>${t.name}</span><span style="color:#8b949e;">${t.artist}</span>`;
                d.onclick = () => playTrack(i);
                pl.appendChild(d);
            });
        }

        function playTrack(i) {
            if (i < 0 || i >= tracks.length) return;
            currentTrack = i;
            audio.src = tracks[i].url;
            audio.play();
            isPlaying = true;
            document.getElementById('play-btn').textContent = '⏸';
            document.getElementById('track-title').textContent = tracks[i].name;
            document.getElementById('track-artist').textContent = tracks[i].artist;
            document.getElementById('now-playing').textContent = tracks[i].name;
            renderPlaylist();
            startVisualizer();
        }

        function togglePlay() {
            if (currentTrack === -1) return;
            if (isPlaying) { audio.pause(); isPlaying = false; document.getElementById('play-btn').textContent = '▶'; }
            else { audio.play(); isPlaying = true; document.getElementById('play-btn').textContent = '⏸'; }
        }

        function nextTrack() { if (currentTrack < tracks.length - 1) playTrack(currentTrack + 1); }
        function prevTrack() { if (currentTrack > 0) playTrack(currentTrack - 1); }

        audio.addEventListener('ended', () => { if (currentTrack < tracks.length - 1) playTrack(currentTrack + 1); else { isPlaying = false; document.getElementById('play-btn').textContent = '▶'; } });
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) document.getElementById('progress-bar').style.width = (audio.currentTime / audio.duration * 100) + '%';
        });

        function seek(e) {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        }

        function startVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                src.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            cancelAnimationFrame(animId);
            function draw() {
                animId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const bars = dataArray.length;
                const barW = canvas.width / bars;
                for (let i = 0; i < bars; i++) {
                    const h = (dataArray[i] / 255) * canvas.height * 0.6;
                    const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - h);
                    grad.addColorStop(0, '#3a82f2');
                    grad.addColorStop(0.5, '#ffb703');
                    grad.addColorStop(1, '#e44d32');
                    ctx.fillStyle = grad;
                    ctx.fillRect(i * barW, canvas.height - h, barW - 2, h);
                }
            }
            draw();
        }
    </script>
</body>
</html>
