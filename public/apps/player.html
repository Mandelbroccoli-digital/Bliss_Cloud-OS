<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../subkernel-bus.js"></script>
    <script src="../subkernel-bridge.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliss Media Player</title>
    <style>
        :root {
            --win-bg: #ece9d8;
            --win-border: #004eae;
            --win-hover: #e5f3ff;
            --win-border-hover: #70c0e7;
            --win-select: #316ac5;
            --win-bar: #f1efe2;
            --accent-color: #316ac5;
            --win-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #808080;
            --viz-bg: #000000;
            --viz-bar: #316ac5;
            --menu-bg: #f0f0f0;
            --menu-hover: #316ac5;
        }
        [data-theme="dark"] {
            --win-bg: #1e222a; --win-bar: #262b34; --win-hover: #2f3744;
            --win-select: #3a6ea5; --win-border: #10141a; --accent-color: #4a90d9;
            --viz-bg: #090b0e; --viz-bar: #38bdf8;
            --menu-bg: #262b34; --menu-hover: #3a6ea5;
        }
        [data-theme="dark"] body { color: #d7dce4; }
        [data-theme="dark"] .player-shell,
        [data-theme="dark"] .playlist { background: #171a20; color: #d7dce4; }
        [data-theme="dark"] .track-row.active { background: var(--win-select); color: #fff; }
        [data-theme="dark"] .menu-dropdown { background: #262b34; border-color: #10141a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Tahoma", sans-serif; font-size: 11px; }
        body, html { width: 100%; height: 100%; background: var(--win-bg); display: flex; flex-direction: column; user-select: none; overflow: hidden; }
        
        /* Top Navigation Menu Bar */
        .menubar { background: var(--win-bar); border-bottom: 1px solid #aca899; display: flex; padding: 2px 4px; gap: 4px; position: relative; }
        .menu-item { position: relative; padding: 2px 6px; cursor: pointer; border: 1px solid transparent; }
        .menu-item:hover, .menu-item.open { background: var(--win-hover); border-color: var(--win-border-hover); }
        .menu-dropdown { display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #7f9db9; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 100; min-width: 120px; }
        .menu-item.open .menu-dropdown { display: block; }
        .dropdown-item { padding: 4px 10px; cursor: pointer; display: block; color: inherit; text-decoration: none; }
        .dropdown-item:hover { background: var(--menu-hover); color: #fff; }

        .player-shell { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 8px; }
        .now-playing { background: var(--win-bar); border: 1px solid #aca899; box-shadow: var(--win-shadow); padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
        .now-playing .art { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent-color), #6aa0e0); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .now-playing .meta { flex: 1; overflow: hidden; }
        .now-playing .title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .now-playing .sub { color: #555; font-size: 10px; }
        canvas#visualizer { width: 100%; height: 50px; background: var(--viz-bg); border: 1px solid #aca899; border-radius: 2px; }
        .transport { display: flex; justify-content: center; gap: 6px; padding: 2px 0; }
        .ai-toolbar { display: flex; gap: 6px; }
        .ai-toolbar button { flex: 1; }
        button { background: #fff; border: 1px solid #7f9db9; box-shadow: var(--win-shadow); border-radius: 2px; padding: 4px 12px; cursor: pointer; font-family: inherit; }
        button:hover:not(:disabled) { background: var(--win-hover); border-color: var(--win-border-hover); }
        button:active:not(:disabled) { box-shadow: inset 1px 1px 2px #808080; }
        button:disabled { opacity: .4; cursor: default; }
        .seek { display: flex; align-items: center; gap: 6px; }
        .seek input { flex: 1; }
        .seek .t { font-variant-numeric: tabular-nums; color: #555; min-width: 36px; text-align: center; }
        .playlist { flex: 1; overflow-y: auto; border: 1px solid #aca899; background: #fff; }
        .track-row { padding: 5px 8px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
        .track-row:hover { background: var(--win-hover); }
        .track-row.active { background: var(--win-select); color: #fff; }
        .track-row .dur { color: #888; font-variant-numeric: tabular-nums; }
        .track-row.active .dur { color: #dce8ff; }
        .scan-bar { display: flex; gap: 4px; align-items: center; }
        .scan-bar input { flex: 1; border: 1px solid #7f9db9; padding: 3px 5px; font-family: inherit; background: var(--win-bar); color: inherit; }
        .status { font-size: 10px; color: #555; min-height: 13px; }
        audio { display: none; }
        .err { color: #b00020; font-family: monospace; }
    </style>
</head>
<body>
    <!-- Top File Navigation Bar -->
    <div class="menubar">
        <div class="menu-item" id="file-menu" onclick="toggleMenu(event)">
            File
            <div class="menu-dropdown">
                <label class="dropdown-item" for="file-input">Load File...</label>
                <div class="dropdown-item" onclick="scanDirectory()">Scan Directory</div>
            </div>
        </div>
        <!-- Hidden file input triggered by menu label -->
        <input type="file" id="file-input" accept="audio/*" style="display:none;" onchange="handleFileSelect(event)">
    </div>

    <div class="player-shell">
        <div class="now-playing">
            <div class="art">🎵</div>
            <div class="meta">
                <div class="title" id="np-title">No track loaded</div>
                <div class="sub" id="np-sub">Bliss Media Player</div>
            </div>
        </div>

        <!-- Real-time Web Audio Spectrum Visualizer -->
        <canvas id="visualizer"></canvas>

        <div class="seek">
            <span class="t" id="cur">0:00</span>
            <input type="range" id="seekbar" min="0" max="1000" value="0" disabled>
            <span class="t" id="dur">0:00</span>
        </div>

        <div class="transport">
            <button onclick="prevTrack()">⏮</button>
            <button id="play-btn" onclick="togglePlay()">▶ Play</button>
            <button onclick="nextTrack()">⏭</button>
        </div>

        <!-- Web Audio AI Controls -->
        <div class="ai-toolbar">
            <button id="ai-eq-btn" onclick="runAutoEQ()">⚡ AI Auto-EQ</button>
            <button id="ai-voice-btn" onclick="listenVoiceCommand()">🎤 Voice Command</button>
        </div>

        <div class="playlist" id="playlist"></div>

        <div class="scan-bar">
            <input type="text" id="scan-path" value="C:\Music" placeholder="Directory to scan">
            <button onclick="scanDirectory()">Scan</button>
        </div>
        <div class="status" id="status">Ready.</div>
    </div>

    <!-- Real audio element -->
    <audio id="audio"></audio>

    <script>
        const AUDIO_EXT = /\.(mp3|flac|wav|ogg|m4a|aac)$/i;
        let tracks = [];          // { name, path, file }
        let currentIndex = -1;
        let objectUrl = null;     // current blob URL (revoked on switch)
        const audio = document.getElementById('audio');

        // Web Audio API Graph Nodes
        let audioCtx, analyser, sourceNode, gainNode, biquadFilter;
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Menu Dropdown Logic
        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('file-menu').classList.toggle('open');
        }
        document.addEventListener('click', () => {
            document.getElementById('file-menu').classList.remove('open');
        });

        function initAudioGraph() {
            if (audioCtx) return;

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser();
            gainNode = audioCtx.createGain();
            biquadFilter = audioCtx.createBiquadFilter();

            analyser.fftSize = 64;

            sourceNode
                .connect(biquadFilter)
                .connect(gainNode)
                .connect(analyser)
                .connect(audioCtx.destination);

            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const computedStyle = getComputedStyle(document.documentElement);
            canvasCtx.fillStyle = computedStyle.getPropertyValue('--viz-bg').trim() || '#000000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 1.2;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                canvasCtx.fillStyle = computedStyle.getPropertyValue('--viz-bar').trim() || '#316ac5';
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                document.getElementById('cur').textContent = fmt(audio.currentTime);
                document.getElementById('seekbar').value = Math.floor((audio.currentTime / audio.duration) * 1000);
            }
        });
        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('dur').textContent = fmt(audio.duration);
            document.getElementById('seekbar').disabled = false;
        });
        audio.addEventListener('ended', () => nextTrack());
        document.getElementById('seekbar').addEventListener('input', (e) => {
            if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration;
        });

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d && d.__bliss26 && d.setVolume !== undefined) {
                audio.volume = d.setVolume;
                if (gainNode) gainNode.gain.value = d.setVolume;
            }
        });

        function fmt(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function setStatus(msg, isErr) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = isErr ? 'status err' : 'status';
        }

        // Direct Local File Picker Handler
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const newTrack = { name: file.name, path: file.name, file: file };
            tracks.unshift(newTrack);
            
            updatePlaylistUI();
            loadTrack(0);
        }

        async function loadTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            currentIndex = index;
            const t = tracks[index];
            document.getElementById('np-title').textContent = t.name;
            document.getElementById('np-sub').textContent = t.path;
            document.querySelectorAll('.track-row').forEach((el, i) => el.classList.toggle('active', i === index));
            setStatus(`Loading ${t.name}…`);

            try {
                if (objectUrl) URL.revokeObjectURL(objectUrl);

                if (t.file) {
                    // Loaded via local file picker input
                    objectUrl = URL.revokeObjectURL(objectUrl);
                    objectUrl = URL.createObjectURL(t.file);
                } else {
                    // Loaded via kernel FS scanning
                    const b64 = await K.invoke('read_file_bytes', { path: t.path });
                    const bin = atob(b64);
                    const len = bin.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
                    objectUrl = URL.createObjectURL(new Blob([bytes]));
                }

                audio.src = objectUrl;

                initAudioGraph();
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                await audio.play();
                updatePlayBtn();
                setStatus(`Playing ${t.name}`);
            } catch (e) {
                setStatus(`Failed to load ${t.name}: ${e}`, true);
            }
        }

        function togglePlay() {
            if (currentIndex < 0) { if (tracks.length) loadTrack(0); return; }
            initAudioGraph();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (audio.paused) { audio.play(); } else { audio.pause(); }
            updatePlayBtn();
        }

        function updatePlayBtn() {
            document.getElementById('play-btn').textContent = audio.paused ? '▶ Play' : '⏸ Pause';
        }

        function prevTrack() { if (tracks.length) loadTrack((currentIndex - 1 + tracks.length) % tracks.length); }
        function nextTrack() { if (tracks.length) loadTrack((currentIndex + 1) % tracks.length); }

        function updatePlaylistUI() {
            const ui = document.getElementById('playlist');
            ui.innerHTML = '';
            tracks.forEach((t, idx) => {
                const row = document.createElement('div');
                row.className = 'track-row' + (idx === currentIndex ? ' active' : '');
                row.innerHTML = `<span>${idx + 1}. ${t.name}</span><span class="dur">${t.file ? 'FILE' : 'LOCAL'}</span>`;
                row.onclick = () => loadTrack(idx);
                ui.appendChild(row);
            });
        }

        async function scanDirectory() {
            const path = document.getElementById('scan-path').value.trim();
            if (!K.hasKernel) { setStatus('Kernel offline — cannot scan host FS', true); return; }
            setStatus(`Scanning ${path}…`);
            try {
                const files = await K.invoke('read_directory', { path });
                const audioFiles = files.filter(f => !f.is_dir && AUDIO_EXT.test(f.name));
                if (!audioFiles.length) { setStatus('No audio files found.', true); return; }
                tracks = audioFiles.map(f => ({ name: f.name, path: f.path }));
                updatePlaylistUI();
                setStatus(`Found ${tracks.length} track(s).`);
                loadTrack(0);
            } catch (e) {
                setStatus(`Scan failed: ${e}`, true);
            }
        }

        // ── AI Capabilities ──
        function runAutoEQ() {
            if (!analyser) return setStatus('Play a track first to use AI Auto-EQ', true);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            const bass = dataArray.slice(0, 5).reduce((a, b) => a + b, 0) / 5;
            const treble = dataArray.slice(-5).reduce((a, b) => a + b, 0) / 5;

            biquadFilter.type = 'lowshelf';
            biquadFilter.frequency.value = 250;

            if (bass < treble) {
                biquadFilter.gain.value = 6;
                setStatus('AI EQ: Low bass detected. Boosted Low-End (+6dB).');
            } else {
                biquadFilter.gain.value = -3;
                setStatus('AI EQ: High bass detected. Tamed low frequencies (-3dB).');
            }
        }

        function listenVoiceCommand() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return setStatus('Speech recognition not supported in browser', true);

            const recognition = new SpeechRecognition();
            setStatus('Listening for voice commands…');
            recognition.start();

            recognition.onresult = (event) => {
                const cmd = event.results[0][0].transcript.toLowerCase();
                setStatus(`Voice Command: "${cmd}"`);

                if (cmd.includes('play')) {
                    if (audio.paused) togglePlay();
                } else if (cmd.includes('pause') || cmd.includes('stop')) {
                    if (!audio.paused) togglePlay();
                } else if (cmd.includes('next')) {
                    nextTrack();
                } else if (cmd.includes('previous') || cmd.includes('back')) {
                    prevTrack();
                } else if (cmd.includes('louder') || cmd.includes('volume up')) {
                    audio.volume = Math.min(1, audio.volume + 0.2);
                } else if (cmd.includes('quieter') || cmd.includes('volume down')) {
                    audio.volume = Math.max(0, audio.volume - 0.2);
                }
            };

            recognition.onerror = (e) => setStatus(`Voice Error: ${e.error}`, true);
        }

        // ── boot ──
        bus.on('System', 'theme-change', ({ theme }) => applyTheme(theme));
        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.removeAttribute('data-theme');
        }
        applyTheme(bus.getState('theme', 'xp'));
        if (K.hasKernel) scanDirectory();
        else setStatus('Kernel offline — player dormant.', true);
    </script>
</body>
</html>
