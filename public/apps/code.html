<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio</title>
    <style>
        :root {
            --bg-dark: #0a0c10; --bg-panel: #12161f; --bg-editor: #0d1117;
            --border-color: #21262d; --accent-gold: #ffb703; --accent-rubedo: #e44d32;
            --accent-blue: #3a82f2; --text-main: #c9d1d9; --text-dim: #8b949e;
            --text-bright: #f0f6fc; --gutter-bg: #161b22;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width:100%; height:100%; overflow:hidden; background:var(--bg-dark); color:var(--text-main); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:13px; }
        #ide-container { display:grid; grid-template-columns:260px 1fr; grid-template-rows:35px 1fr 200px 24px; grid-template-areas:"header header" "sidebar editor" "sidebar terminal" "status status"; width:100vw; height:100vh; }
        header { grid-area:header; background:#161b22; border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-weight:600; }
        .branding { display:flex; align-items:center; gap:8px; color:var(--text-bright); }
        .branding span { color:var(--accent-gold); font-size:11px; border:1px solid var(--accent-gold); padding:1px 5px; border-radius:3px; }
        .toolbar { display:flex; gap:8px; }
        .btn-tool { background:var(--bg-panel); border:1px solid var(--border-color); color:var(--text-main); padding:3px 8px; font-size:11px; border-radius:3px; cursor:pointer; }
        .btn-tool:hover { background:#21262d; color:var(--text-bright); }
        #sidebar { grid-area:sidebar; background:var(--bg-panel); border-right:1px solid var(--border-color); display:flex; flex-direction:column; overflow:hidden; }
        .sidebar-title { padding:8px 12px; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; }
        .explorer-tree { flex:1; overflow-y:auto; padding:6px 0; font-family:var(--font-mono); font-size:12px; }
        .tree-item { padding:4px 12px; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; color:var(--text-main); }
        .tree-item:hover { background:rgba(255,255,255,0.05); color:var(--text-bright); }
        .tree-item.active { background:rgba(58,130,242,0.2); color:var(--accent-blue); font-weight:bold; }
        .tree-item.folder { font-weight:bold; color:var(--text-bright); }
        .tree-indent-1 { padding-left:20px; }
        #editor-wrapper { grid-area:editor; background:var(--bg-editor); display:flex; position:relative; overflow:hidden; }
        #gutter { width:45px; background:var(--gutter-bg); border-right:1px solid var(--border-color); color:var(--text-dim); font-family:var(--font-mono); font-size:12px; line-height:20px; padding:10px 0; text-align:right; user-select:none; overflow:hidden; }
        .gutter-line { padding-right:8px; position:relative; }
        .gutter-line.sml-marker::before { content:"●"; position:absolute; left:4px; font-size:8px; color:var(--accent-gold); }
        .gutter-line.sml-rubedo::before { color:var(--accent-rubedo); }
        #editor-container { flex:1; position:relative; }
        #code-editor { width:100%; height:100%; background:transparent; border:none; outline:none; color:#e6edf3; font-family:var(--font-mono); font-size:12px; line-height:20px; padding:10px; resize:none; white-space:pre; tab-size:4; }
        #terminal-panel { grid-area:terminal; background:#05070a; border-top:1px solid var(--border-color); border-right:1px solid var(--border-color); display:flex; flex-direction:column; font-family:var(--font-mono); }
        .panel-header { background:var(--bg-panel); padding:4px 12px; font-size:11px; color:var(--text-dim); border-bottom:1px solid var(--border-color); display:flex; gap:15px; }
        .panel-tab { cursor:pointer; }
        .panel-tab.active { color:var(--text-bright); font-weight:bold; border-bottom:2px solid var(--accent-blue); }
        #terminal-output { flex:1; padding:8px 12px; overflow-y:auto; font-size:12px; color:#7ee787; display:flex; flex-direction:column; gap:4px; }
        .term-line { word-break:break-all; }
        .term-err { color:#f85149; }
        .term-mali { color:var(--accent-gold); }
        .terminal-input-bar { display:flex; align-items:center; background:#0d1117; border-top:1px solid var(--border-color); padding:4px 8px; }
        .prompt { color:var(--accent-blue); font-weight:bold; margin-right:8px; }
        #term-input { flex:1; background:transparent; border:none; outline:none; color:var(--text-bright); font-family:var(--font-mono); font-size:12px; }
        #status-bar { grid-area:status; background:#161b22; border-top:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:11px; color:var(--text-dim); }
        .status-left, .status-right { display:flex; gap:12px; align-items:center; }
        .dot-online { width:6px; height:6px; background:#3fb950; border-radius:50%; }
    </style>
</head>
<body>
<div id="ide-container">
    <header>
        <div class="branding"><span>MALI 2.2B</span><strong>Code Studio</strong></div>
        <div class="toolbar">
            <button class="btn-tool" onclick="triggerAnalysis()">⚡ Analyze</button>
            <button class="btn-tool" onclick="saveFile()">💾 Save</button>
        </div>
    </header>
    <div id="sidebar">
        <div class="sidebar-title"><span>Workspace</span><span>📂</span></div>
        <div class="explorer-tree" id="tree-container"></div>
    </div>
    <div id="editor-wrapper">
        <div id="gutter"></div>
        <div id="editor-container"><textarea id="code-editor" spellcheck="false"></textarea></div>
    </div>
    <div id="terminal-panel">
        <div class="panel-header">
            <span class="panel-tab active">SHELL</span>
            <span class="panel-tab">MALI FEED</span>
            <span class="panel-tab">MCP ROUTER</span>
        </div>
        <div id="terminal-output">
            <div class="term-line term-mali">[Kernel] Local execution pipeline initialized.</div>
            <div class="term-line">[Shell] Type 'help' for commands.</div>
        </div>
        <div class="terminal-input-bar">
            <span class="prompt">$</span>
            <input type="text" id="term-input" placeholder="Execute command...">
        </div>
    </div>
    <div id="status-bar">
        <div class="status-left">
            <div style="display:flex;align-items:center;gap:4px;"><span class="dot-online"></span> Mali: Active</div>
            <div>SML Phase: Citrinitas</div>
        </div>
        <div class="status-right">
            <span id="cursor-pos">Ln 1, Col 1</span>
            <span>UTF-8</span>
            <span>ChorusDSL</span>
        </div>
    </div>
</div>
<script>
    const virtualFS = {
        "00_ROOT": { type:"folder", children: {
            "AGENTS.md": { type:"file", content:"# Agent Instructions\n\n@tag:mali.context\n- Execute hermetic code loops.\n- Stream output without timeout restrictions." },
            "main.chorx": { type:"file", content:"// ChorusDSL v2.0\nvoice scan_directory(path) {\n    @sml:nigredo\n    emit FindFirstFile(path);\n}\n\nvoice process_node(node_id) {\n    @sml:rubedo\n    emit TranspileTarget(node_id);\n}" }
        }},
        "04_LAB": { type:"folder", children: {
            "mcp_bridge.ts": { type:"file", content:"// MCP Host JSON-RPC Adapter\nexport function initMCPBridge() {\n    console.log('MCP Host online');\n}" }
        }}
    };
    let activeFilePath = "00_ROOT/main.chorx";
    const editor = document.getElementById('code-editor');
    const gutter = document.getElementById('gutter');
    const treeContainer = document.getElementById('tree-container');
    const termOutput = document.getElementById('terminal-output');
    const termInput = document.getElementById('term-input');
    const cursorPos = document.getElementById('cursor-pos');

    function updateGutter() {
        const lines = editor.value.split('\n');
        gutter.innerHTML = lines.map((line, i) => {
            let cls = '';
            if (line.includes('@sml:rubedo') || line.includes('@sml:citrinitas')) cls = 'sml-marker sml-rubedo';
            else if (line.includes('@sml:') || line.includes('@tag:')) cls = 'sml-marker';
            return `<div class="gutter-line ${cls}">${i+1}</div>`;
        }).join('');
        gutter.scrollTop = editor.scrollTop;
    }

    function renderExplorer() {
        treeContainer.innerHTML = '';
        function traverse(obj, path, indent) {
            for (const name in obj) {
                const item = obj[name];
                const cur = path ? `${path}/${name}` : name;
                const div = document.createElement('div');
                div.className = `tree-item ${indent ? 'tree-indent-'+indent : ''} ${item.type==='folder'?'folder':''}`;
                if (cur === activeFilePath) div.classList.add('active');
                div.innerHTML = `${item.type==='folder'?'📁':'📄'} ${name}`;
                if (item.type === 'file') div.onclick = () => loadFile(cur, item.content);
                treeContainer.appendChild(div);
                if (item.type === 'folder' && item.children) traverse(item.children, cur, indent+1);
            }
        }
        traverse(virtualFS, '', 0);
    }

    function loadFile(path, content) {
        activeFilePath = path; editor.value = content;
        renderExplorer(); updateGutter();
        log(`[Workspace] Opened: ${path}`, 'term-mali');
    }

    function saveFile() {
        const [dir, file] = activeFilePath.split('/');
        if (virtualFS[dir]?.children[file]) { virtualFS[dir].children[file].content = editor.value; log(`[Workspace] Saved ${activeFilePath}`, 'term-mali'); }
    }

    function log(text, cls='') {
        const d = document.createElement('div');
        d.className = `term-line ${cls}`; d.innerText = text;
        termOutput.appendChild(d); termOutput.scrollTop = termOutput.scrollHeight;
    }

    function handleCmd(cmd) {
        if (!cmd.trim()) return;
        log(`$ ${cmd}`);
        const [c] = cmd.trim().split(' ');
        switch(c.toLowerCase()) {
            case 'help': log('Commands: help, clear, mali, run, ls'); break;
            case 'clear': termOutput.innerHTML = ''; break;
            case 'mali': log(`[Mali 2.2B] ${editor.value.length} bytes loaded. Markers aligned.`, 'term-mali'); break;
            case 'run': log(`[Engine] Transpiling ${activeFilePath}...`); setTimeout(() => log(`[Transpiler] Build OK.`, 'term-mali'), 600); break;
            case 'ls': Object.keys(virtualFS).forEach(k => log(`📁 ${k}`)); break;
            default: log(`bash: ${c}: command not found`, 'term-err');
        }
    }

    function triggerAnalysis() {
        log('[Inspector] Running structural analysis...', 'term-mali');
        setTimeout(() => { updateGutter(); log('[Inspector] Markers synchronized.', 'term-mali'); }, 300);
    }

    editor.addEventListener('input', updateGutter);
    editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });
    editor.addEventListener('keyup', () => {
        const lines = editor.value.substr(0, editor.selectionStart).split('\n');
        cursorPos.innerText = `Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;
    });
    termInput.addEventListener('keydown', e => { if (e.key==='Enter') { handleCmd(termInput.value); termInput.value=''; } });

    window.onload = () => { renderExplorer(); loadFile("00_ROOT/main.chorx", virtualFS["00_ROOT"].children["main.chorx"].content); };
</script>
</body>
</html>
