<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../subkernel-bus.js"></script>
<script src="../subkernel-bridge.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouro-Hub | Browser Core</title>
    <style>
        :root { 
            --gold: #FFD700; 
            --stem: #2ECC71; 
            --cyan: #00F2FF;
            --bg: #0A0E14; 
            --panel: #141A21; 
            --border: #1F2937;
            --text: #E0E0E0; 
            --font: 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: var(--font); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            border-top: 2px solid var(--stem);
            overflow: hidden;
        }

        /* Nav & Address Bar */
        #nav-bar {
            background: var(--panel); 
            padding: 8px 12px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            gap: 10px; 
            align-items: center;
            z-index: 100;
        }

        #url-bar { 
            background: #0A0E14; 
            border: 1px solid var(--border); 
            color: var(--cyan); 
            padding: 8px 12px; 
            border-radius: 4px; 
            flex: 1; 
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #url-bar:focus {
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.15);
        }

        .btn {
            background: #0D131A; 
            border: 1px solid var(--border);
            color: var(--text); 
            padding: 8px 16px;
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 12px;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover { 
            border-color: var(--cyan); 
            background: #161F29; 
            color: var(--cyan);
        }

        .btn:active {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Viewport Stage */
        #viewport { 
            flex: 1; 
            position: relative; 
            width: 100%;
            height: 100%;
            background: #FFFFFF;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #FFFFFF; 
        }

        /* Status Bar */
        #status-bar { 
            font-size: 11px; 
            padding: 6px 15px; 
            background: #05070A; 
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            color: #888888;
        }

        #st-msg {
            color: var(--stem);
        }

        #st-time {
            color: var(--gold);
        }
    </style>
</head>
<body>

<div id="nav-bar">
    <input type="text" id="url-bar" value="https://www.google.com/search?igu=1" placeholder="Navigate the Lattice..." onkeydown="handleKeyPress(event)">
    <button class="btn" onclick="navigate()">EXECUTE</button>
</div>

<div id="viewport">
    <iframe id="mandel-frame" src="https://www.google.com/search?igu=1"></iframe>
</div>

<div id="status-bar">
    <span id="st-msg">🥦 Ouro-Hub | Browser Core Active</span>
    <span id="st-time">τ: 00:00:00</span>
</div>

<script>
    function navigate() {
        let url = document.getElementById('url-bar').value.trim();
        if (!url) return;
        
        // Auto-prefix protocol if missing
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        
        document.getElementById('mandel-frame').src = url;
        document.getElementById('st-msg').innerText = `🥦 Navigated: ${url}`;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            navigate();
        }
    }

    function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('st-time').innerText = `τ: ${h}:${m}:${s}`;
    }

    window.onload = () => {
        updateTime();
        setInterval(updateTime, 1000);
    };
</script>
</body>
</html>
