<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CloudOS — a nodegraph operating system</title>
  <meta name="description" content="A desktop whose canonical state is one typed property graph. Files, folders, apps, processes, windows and services are all nodes; the desktop, Floret's node map, the task manager and the graph inspector are projections of that single graph.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/shell/shell.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="os">
  <div id="desktop">
    <div id="icon-layer"></div>
    <div id="window-layer"></div>
  </div>

  <div id="taskbar">
    <button id="start-btn"><span class="led"></span>start</button>
    <div id="task-tabs"></div>
    <div id="tray">
      <span class="tray-status" id="tray-status"></span>
      <span id="tray-led" class="led" style="width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399;display:inline-block"></span>
      <button class="tray-btn" id="tray-graph" title="Graph Store">🕸️</button>
      <button class="tray-btn" id="tray-wallpaper" title="Next wallpaper">🎨</button>
      <button class="tray-btn" id="tray-theme" title="Toggle dark / XP">🌗</button>
      <button class="tray-btn" id="tray-clock" title="Task Manager">--:--</button>
    </div>
  </div>
</div>

<div id="start-menu"></div>

<div id="ctx-menu"></div>

<div id="switcher">
  <div class="switcher-card">
    <h4>Switch window — Ctrl+`</h4>
    <div id="switcher-list"></div>
  </div>
</div>

<div id="flash-overlay"></div>

<div id="boot-veil">
  <div class="logo">🪐</div>
  <div class="title">CloudOS</div>
  <div class="bar-track"><div class="bar-fill" id="boot-veil-bar"></div></div>
  <div class="sub" id="boot-veil-sub">booting…</div>
</div>

<!-- React engine root mount -->
<div id="root" style="display:none"></div>

<script>
  // Web fallback for Electron API if not running in native Electron
  if (!window.electronAPI) {
    window.electronAPI = {
      sendAIStream: (channel, data) => {
        console.log('[electronAPI stub] sendAIStream:', channel, data);
      },
      onAIStreamChunk: (channel, callback) => {
        return () => {};
      },
      executeCommand: async (cmd) => {
        console.log('[electronAPI stub] executeCommand:', cmd);
        return `[command executed]: ${cmd}`;
      },
      minimize: () => {},
      maximize: () => {},
      close: () => {}
    };
  }
</script>

<script type="module" src="/src/main.tsx"></script>
<script type="module">
  import { bootKernel } from "./src/kernel/kernel.js";
  import { createShell } from "./src/shell/shell.js";

  const veilSub = document.getElementById('boot-veil-sub');
  let kernel = null;

  try {
    kernel = await bootKernel();
    const shell = createShell(kernel);
    window.cloudosShell = shell;
    await shell.boot();
  } catch (error) {
    console.error('[Shell] boot failed', error);
    if (veilSub) {
      veilSub.textContent = 'boot failed: ' + error.message;
      veilSub.style.color = '#fb7185';
    }
  }
</script>
</body>
</html>
