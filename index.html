            --aero-glass: rgba(255,255,255,0.55);
            --aero-glow: 0 0 12px rgba(120,180,255,0.45);
            background-color: #aacbef !important;
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
        }
        body[data-theme="aero"] #desktop {
            background: radial-gradient(circle at 50% 120%, rgba(255,255,255,0.55), rgba(255,255,255,0) 60%),
                        linear-gradient(180deg, #cfe3ff 0%, #aacbef 45%, #8fb3e0 100%) !important;
        }
        body[data-theme="aero"] .shortcut {
            color: #06203f; text-shadow: 0 1px 1px rgba(255,255,255,0.8);
            background: var(--aero-glass); border: 1px solid #b5d3ff;
            border-radius: 8px; backdrop-filter: blur(3px);
        }
        body[data-theme="aero"] .shortcut:hover { background: rgba(255,255,255,0.78); transform: translateY(-2px) scale(1.04); box-shadow: var(--aero-glow); }
        body[data-theme="aero"] #taskbar {
            background: linear-gradient(180deg, #eaf3ff 0%, #b9d4f2 8%, #7fa9da 100%);
            border-top: 1px solid #5b86bd; box-shadow: 0 -1px 6px rgba(40,80,140,0.3);
        }
        body[data-theme="aero"] #start-btn {
            background: linear-gradient(180deg, #6fcf5f 0%, #3f9c3a 50%, #2c7a2c 100%);
            color: #fff; border: 1px solid #1f5e1f; border-radius: 6px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.4);
        }
        body[data-theme="aero"] .system-tray, body[data-theme="aero"] #tray-status { color: #06203f; }
        .shortcut[data-app="garden"] span.icon { filter: drop-shadow(0 0 6px rgba(80,220,120,0.7)); }
        .shortcut[data-app="garden"]:hover { box-shadow: 0 0 14px rgba(80,220,120,0.6); }

        /* ── Desktop ── */
        #desktop {
            width: 100%; height: calc(100% - 30px);
            background: url('/wallpaper-sunset.webp') no-repeat center center;
            background-size: cover;
            position: relative; padding: 15px;
            display: grid; grid-template-columns: repeat(auto-fill, 90px);
            grid-template-rows: repeat(auto-fill, 90px); grid-auto-flow: column; gap: 12px;
            overflow: hidden;
        }

<!-- Desktop (hidden on mobile) -->

    <div class="shortcut" ondblclick="launchApp('explorer')"><span class="icon">📂</span>Explorer</div>
    <!-- shortcuts trimmed -->
</div>

<!-- Taskbar (desktop only) — parity with the Tauri shell: live status + LEDs + clock, no stray placeholders -->
<div id="taskbar" style="display:none">
    <div class="taskbar-left">
        <button id="start-btn" onclick="toggleStartMenu()">start</button>

</div>

<!-- Start Menu (desktop) -->

    <!-- Redirect wallpaper control to Personalize (Control Panel) -->
    <div class="ctx-item" onclick="launchApp('control-panel');closeCtxMenu()">🎨 Personalize…</div>
    <div class="ctx-item" onclick="launchApp('settings');closeCtxMenu()">Display Settings</div>
    <div class="ctx-item" onclick="launchApp('terminal');closeCtxMenu()">Open Terminal</div>
</div>

<!-- Mobile and other UI trimmed for brevity -->

<div id="root" style="display:none"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
let topZ = 10;
const openWindows = new Map();
let activeWindowId = null;
const isMobile = () => window.innerWidth <= 768;

// ... other shell helpers trimmed for brevity ...

// ===== Wallpaper subsystem (centralized, robust) =====
const Wallpapers = [
    '/wallpaper-sunset.webp',
    '/wallpaper-aurora.webp',
    '/wallpaper-ocean.webp',
    'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)',
    'linear-gradient(135deg, #003399 0%, #001133 100%)',
    'linear-gradient(135deg, #1e1b4b 0%, #311b92 100%)'
];
let currentWallpaperIdx = parseInt(localStorage.getItem('bliss26_wp_idx') || '0');

function applyWallpaperRaw(wp) {
    const desktop = document.getElementById('desktop');
    if (!desktop) return;
    if (typeof wp === 'number') wp = Wallpapers[wp % Wallpapers.length];

    if (typeof wp === 'string') {
        if (wp.startsWith('http') || wp.startsWith('/')) {
            desktop.style.background = `url('${wp}') no-repeat center center`;
            desktop.style.backgroundSize = 'cover';
        } else {
            // gradients or other CSS values
            desktop.style.background = wp;
        }
    }
}

function validateImageUrl(url, timeout = 5000) {
    return new Promise((resolve) => {
        try {
            const img = new Image();
            let done = false;
            const to = setTimeout(() => { if (!done) { done = true; img.src = ''; resolve(false); } }, timeout);
            img.onload = () => { if (!done) { done = true; clearTimeout(to); resolve(true); } };
            img.onerror = () => { if (!done) { done = true; clearTimeout(to); resolve(false); } };
            img.src = url;
        } catch (e) { resolve(false); }
    });
}

window.setWallpaper = async function(opts) {
    // opts: { index:number } | { url:string } | { gradient:string }
    if (opts == null) return;
    if (typeof opts.index === 'number') {
        currentWallpaperIdx = opts.index % Wallpapers.length;
        localStorage.setItem('bliss26_wp_idx', String(currentWallpaperIdx));
        localStorage.removeItem('bliss26_wp');
        applyWallpaperRaw(currentWallpaperIdx);
        return;
    }
    if (typeof opts.url === 'string') {
        const ok = await validateImageUrl(opts.url);
        if (!ok) {
            console.warn('Wallpaper image failed to load:', opts.url);
            // Fallback: do nothing (keep existing) — caller may notify user
            return;
        }
        localStorage.setItem('bliss26_wp', opts.url);
        localStorage.removeItem('bliss26_wp_idx');
        applyWallpaperRaw(opts.url);
        return;
    }
    if (typeof opts.gradient === 'string') {
        localStorage.setItem('bliss26_wp', opts.gradient);
        localStorage.removeItem('bliss26_wp_idx');
        applyWallpaperRaw(opts.gradient);
        return;
    }
}

window.changeWallpaper = function() {
    // Respect an explicit persisted custom wallpaper first
    const stored = localStorage.getItem('bliss26_wp');
    if (stored) {
        // If a custom URL/gradient exists, move to the next built-in index instead
        currentWallpaperIdx = (currentWallpaperIdx + 1) % Wallpapers.length;
        window.setWallpaper({ index: currentWallpaperIdx });
        return;
    }
    currentWallpaperIdx = (currentWallpaperIdx + 1) % Wallpapers.length;
    window.setWallpaper({ index: currentWallpaperIdx });
};

// Apply persisted wallpaper on boot (url/gradient preferred over index)
(function restoreWallpaperOnBoot() {
    const stored = localStorage.getItem('bliss26_wp');
    if (stored) {
        applyWallpaperRaw(stored);
        return;
    }
    const idx = parseInt(localStorage.getItem('bliss26_wp_idx') || '0');
    applyWallpaperRaw(idx);
})();

// Listen for Control Panel / bus requests to change wallpaper
if (window.subkernel && window.subkernel.on) {
    window.subkernel.on('Shell', 'wallpaper', ({ index, url, gradient } = {}) => {
        if (typeof index === 'number') window.setWallpaper({ index });
        else if (typeof url === 'string') window.setWallpaper({ url });
        else if (typeof gradient === 'string') window.setWallpaper({ gradient });
    });
}

// Ensure contextmenu opening logic still uses ctx-menu element
document.addEventListener('contextmenu', e => {
    if (isMobile()) return;
    const desktop = document.getElementById('desktop');
    if (desktop && desktop.style.display !== 'none' && (e.target.id === 'desktop' || e.target.closest('#desktop') === desktop)) {
        e.preventDefault();
        const m = document.getElementById('ctx-menu');
        m.style.cssText = `display:block;left:${e.clientX}px;top:${Math.min(e.clientY, window.innerHeight - 120)}px`;
    }
});

// ... rest of shell script continues unchanged ...
</script>
</body>
